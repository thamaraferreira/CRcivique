géographie et culture", "q": "En quelle année l'euro est-elle devenue la monnaie utilisée en France ?", "a": "2002 (pour les billets et pièces)", "wrong": ["1995", "1999", "2010"], "explain": "L'euro a remplacé le franc français le 1er janvier 2002 pour les pièces et billets. La conversion scripturale (bancaire) avait eu lieu le 1er janvier 1999 avec la fixation définitive des taux de change."}, {"t": "Histoire géographie et culture", "q": "En quelle année a commencé la Première Guerre mondiale ?", "a": "1914", "wrong": ["1870", "1939", "1900"], "explain": "La Première Guerre mondiale a commencé le 28 juillet 1914 avec la déclaration de guerre de l'Autriche-Hongrie à la Serbie, après l'assassinat de l'archiduc François-Ferdinand à Sarajevo le 28 juin 1914."}, {"t": "Histoire géographie et culture", "q": "Où a eu lieu le débarquement en 1944 ?", "a": "En Normandie, sur les côtes françaises de la Manche", "wrong": ["En Provence, sur les côtes méditerranéennes", "En Bretagne, sur les côtes atlantiques", "Dans le Pas-de-Calais, sur les côtes de la mer du Nord"], "explain": "Le débarquement du 6 juin 1944 (Jour-J, opération Overlord) a eu lieu sur les plages de Normandie. C'est la plus grande opération amphibie de l'histoire, qui marqua le début de la libération de la France."}, {"t": "Histoire géographie et culture", "q": "Quel continent a été le plus concerné par la décolonisation française après la Seconde Guerre mondiale ?", "a": "L'Afrique", "wrong": ["L'Asie", "L'Amérique", "L'Océanie"], "explain": "C'est principalement en Afrique qu'a eu lieu la décolonisation française après 1945. La plupart des colonies africaines françaises ont obtenu leur indépendance entre 1956 et 1962."}, {"t": "Histoire géographie et culture", "q": "Que fête-t-on le 8 mai ?", "a": "La victoire des Alliés et la fin de la Seconde Guerre mondiale en Europe (1945)", "wrong": ["La fin de la Première Guerre mondiale en 1918", "La libération de Paris en 1944", "La proclamation de la Ve République en 1958"], "explain": "Le 8 mai commémore la capitulation de l'Allemagne nazie signée le 8 mai 1945, mettant fin à la Seconde Guerre mondiale en Europe. C'est un jour férié en France depuis 1981."}, {"t": "Histoire géographie et culture", "q": "Quelle mer ou océan borde la France métropolitaine ?", "a": "L'océan Atlantique et la mer Méditerranée", "wrong": ["L'océan Indien et la mer du Nord uniquement", "L'océan Pacifique et la mer Baltique", "La mer Noire et la mer Adriatique"], "explain": "La France métropolitaine est bordée à l'ouest par l'océan Atlantique, au sud par la mer Méditerranée, au nord par la Manche et la mer du Nord. Elle est ainsi ouverte sur plusieurs espaces maritimes importants."}, {"t": "Histoire géographie et culture", "q": "Quel pays a une frontière terrestre avec la France métropolitaine ?", "a": "L'Espagne", "wrong": ["Le Royaume-Uni", "Le Danemark", "La Pologne"], "explain": "La France métropolitaine partage des frontières terrestres avec 8 pays : l'Espagne, l'Andorre, Monaco, l'Italie, la Suisse, l'Allemagne, le Luxembourg et la Belgique. Le Royaume-Uni n'est accessible que par la mer ou le tunnel."}, {"t": "Histoire géographie et culture", "q": "Quelle ville française est un port maritime ?", "a": "Le Havre", "wrong": ["Grenoble", "Clermont-Ferrand", "Lyon"], "explain": "Le Havre est le deuxième port de France (après Marseille) et l'un des plus importants d'Europe du Nord. Situé à l'estuaire de la Seine, il est un carrefour majeur du commerce international."}, {"t": "Histoire géographie et culture", "q": "Quelle mer se situe entre la France et l'Angleterre ?", "a": "La Manche", "wrong": ["La mer du Nord", "La mer Celtique", "La mer d'Irlande"], "explain": "La Manche est le bras de mer qui sépare la France du Royaume-Uni. Elle est traversée par le tunnel sous la Manche (inauguré en 1994) qui relie Calais à Folkestone."}, {"t": "Histoire géographie et culture", "q": "Qu'est-ce que la France d'outre-mer ?", "a": "Les territoires français situés hors de la France métropolitaine, dans différentes parties du monde", "wrong": ["Les anciennes colonies françaises devenues indépendantes", "Les ambassades et consulats français à l'étranger", "Les zones économiques exclusives maritimes de la France"], "explain": "La France d'outre-mer comprend des territoires français situés en dehors de la France européenne : 5 DROM (dont la Martinique, la Guadeloupe, La Réunion), des collectivités d'outre-mer et des territoires dans 3 océans."}, {"t": "Histoire géographie et culture", "q": "Quelle chaîne de montagnes est située entre la France et l'Espagne ?", "a": "Les Pyrénées", "wrong": ["Les Alpes", "Le Massif central", "Les Vosges"], "explain": "Les Pyrénées forment la frontière naturelle entre la France et l'Espagne, s'étendant sur environ 430 km de l'océan Atlantique à la mer Méditerranée. Le Vignemale (3 298 m) est le plus haut sommet côté français."}, {"t": "Histoire géographie et culture", "q": "Quelle île française se trouve dans l'océan Indien ?", "a": "La Réunion", "wrong": ["La Martinique", "La Guadeloupe", "La Nouvelle-Calédonie"], "explain": "La Réunion est un département et région d'outre-mer français situé dans l'océan Indien, à environ 800 km à l'est de Madagascar. La Martinique et la Guadeloupe se trouvent dans les Caraïbes."}, {"t": "Histoire géographie et culture", "q": "Quelle est la population approximative de la France en 2025 ?", "a": "Environ 68 millions d'habitants", "wrong": ["Environ 45 millions d'habitants", "Environ 80 millions d'habitants", "Environ 55 millions d'habitants"], "explain": "La France comptait environ 68 millions d'habitants en 2025. C'est le deuxième pays le plus peuplé de l'Union européenne, après l'Allemagne."}, {"t": "Histoire géographie et culture", "q": "Quel fleuve traverse Paris ?", "a": "La Seine", "wrong": ["La Loire", "Le Rhône", "La Garonne"], "explain": "La Seine traverse Paris sur environ 12 km. Ce fleuve long de 776 km prend sa source en Bourgogne et se jette dans la Manche à l'estuaire du Havre. Il a joué un rôle fondamental dans le développement de Paris."}, {"t": "Histoire géographie et culture", "q": "Lequel de ces pays partage des frontières terrestres avec la France ?", "a": "La Belgique", "wrong": ["Le Portugal", "Le Maroc", "Le Royaume-Uni"], "explain": "La Belgique partage une frontière terrestre avec la France au nord. La France a 8 voisins terrestres : Belgique, Luxembourg, Allemagne, Suisse, Italie, Monaco, Andorre et Espagne."}, {"t": "Histoire géographie et culture", "q": "Quel pays a une frontière avec la France métropolitaine au nord-est ?", "a": "L'Allemagne", "wrong": ["Le Danemark", "Les Pays-Bas", "La Pologne"], "explain": "L'Allemagne partage une frontière d'environ 450 km avec la France au nord-est, le long du Rhin notamment. Cette frontière est aujourd'hui pleinement ouverte dans le cadre de l'espace Schengen."}, {"t": "Histoire géographie et culture", "q": "Où se trouvent les principales activités économiques en France ?", "a": "Dans les grandes métropoles et leurs agglomérations", "wrong": ["Exclusivement dans les zones rurales agricoles", "Uniquement dans les ports et zones côtières", "Seulement dans la région parisienne"], "explain": "Les principales activités économiques françaises sont concentrées dans les grandes métropoles (Paris, Lyon, Marseille, Bordeaux, Toulouse...) et leurs agglomérations, qui regroupent la majorité des entreprises et des emplois."}, {"t": "Histoire géographie et culture", "q": "Parmi ces pays, lequel attire le plus de visiteurs chaque année ?", "a": "La France", "wrong": ["Les États-Unis", "L'Espagne", "La Chine"], "explain": "La France est régulièrement le pays le plus visité au monde avec environ 100 millions de touristes étrangers par an. Paris et ses environs constituent la destination touristique la plus fréquentée."}, {"t": "Histoire géographie et culture", "q": "Où habite la majorité des Français ?", "a": "En zone urbaine", "wrong": ["En zone rurale", "Dans les départements d'outre-mer", "Sur le littoral atlantique"], "explain": "Environ 80 % des Français vivent en zone urbaine (villes et agglomérations). L'urbanisation s'est fortement accélérée depuis les années 1950-1960, avec l'exode rural et l'industrialisation."}, {"t": "Histoire géographie et culture", "q": "Quelle région est la plus peuplée ?", "a": "L'Île-de-France", "wrong": ["La région PACA", "La région Auvergne-Rhône-Alpes", "La région Occitanie"], "explain": "L'Île-de-France est la région la plus peuplée de France avec environ 12 millions d'habitants (sur 68 millions), soit près de 18 % de la population nationale concentrée sur 2 % du territoire."}, {"t": "Histoire géographie et culture", "q": "Quelle ville française fait partie des 10 plus grandes métropoles du pays ?", "a": "Toulouse", "wrong": ["Reims", "Dijon", "Brest"], "explain": "Toulouse est la 4e ville de France par sa population. Elle est suivie de Nice, Nantes, Strasbourg, Montpellier et Bordeaux dans le classement des grandes métropoles françaises."}, {"t": "Histoire géographie et culture", "q": "Lequel de ces départements de France est le plus touristique ?", "a": "Les Alpes-Maritimes (06)", "wrong": ["La Creuse (23)", "La Meuse (55)", "La Haute-Marne (52)"], "explain": "Les Alpes-Maritimes (Nice, Cannes, Antibes...) est l'un des départements les plus touristiques de France grâce à la Côte d'Azur, son ensoleillement, ses plages et ses sites culturels."}, {"t": "Histoire géographie et culture", "q": "Quand peut-on visiter gratuitement des lieux culturels en France ?", "a": "Lors des Journées européennes du Patrimoine (en septembre)", "wrong": ["Tous les dimanches de l'année dans tous les musées", "Uniquement le 14 juillet", "Lors du premier dimanche de chaque mois dans tous les musées nationaux"], "explain": "Les Journées européennes du Patrimoine, organisées chaque année en septembre, permettent de visiter gratuitement de nombreux monuments, musées et lieux habituellement fermés au public."}, {"t": "Histoire géographie et culture", "q": "Combien de personnes parlent français dans le monde ?", "a": "Environ 300 millions de locuteurs", "wrong": ["Environ 50 millions de locuteurs", "Environ 100 millions de locuteurs", "Environ 500 millions de locuteurs"], "explain": "Le français est parlé par environ 300 millions de personnes dans le monde selon l'Organisation Internationale de la Francophonie (OIF). C'est l'une des 6 langues officielles de l'ONU."}, {"t": "Histoire géographie et culture", "q": "Qui était Marguerite Yourcenar ?", "a": "Une romancière française, première femme élue à l'Académie française", "wrong": ["Une exploratrice qui a cartographié les DOM-TOM", "Une physicienne ayant reçu le Prix Nobel de chimie", "Une résistante ayant organisé des filières d'évasion pendant la guerre"], "explain": "Marguerite Yourcenar (1903-1987) est une romancière et essayiste française, connue pour ses Mémoires d'Hadrien (1951). En 1980, elle est devenue la première femme élue à l'Académie française."}, {"t": "Histoire géographie et culture", "q": "Quel peintre est français ?", "a": "Édouard Manet", "wrong": ["Rembrandt", "Léonard de Vinci", "Pablo Picasso"], "explain": "Édouard Manet (1832-1883) est un peintre français précurseur de l'impressionnisme. Son tableau Le Déjeuner sur l'herbe (1863) a fait scandale. Rembrandt est néerlandais, De Vinci italien, Picasso espagnol."}, {"t": "Histoire géographie et culture", "q": "Quel musée est situé à Paris ?", "a": "Le Centre Pompidou (musée d'Art moderne)", "wrong": ["Le Rijksmuseum", "Le musée du Prado", "La Tate Modern"], "explain": "Le Centre Pompidou, inauguré en 1977 dans le quartier Beaubourg à Paris, abrite le Musée national d'Art moderne. Le Rijksmuseum est à Amsterdam, le Prado à Madrid, la Tate Modern à Londres."}, {"t": "Histoire géographie et culture", "q": "Qui était Auguste Rodin ?", "a": "Un sculpteur français du XIXe siècle, auteur du Penseur", "wrong": ["Un peintre impressionniste de la Belle Époque", "Un architecte qui construisit le palais de Versailles", "Un compositeur romantique du XIXe siècle"], "explain": "Auguste Rodin (1840-1917) est le plus célèbre sculpteur français. Ses œuvres majeures incluent Le Penseur, Le Baiser et Les Bourgeois de Calais. Son musée, situé à Paris, est l'un des plus visités de France."}, {"t": "Histoire géographie et culture", "q": "Quel est le classement de la langue française parmi les langues les plus parlées dans le monde ?", "a": "Parmi les 10 premières langues du monde", "wrong": ["La langue la plus parlée au monde", "La 50e langue mondiale", "Une langue parlée uniquement en France et en Afrique"], "explain": "Le français est l'une des 10 langues les plus parlées dans le monde. C'est une langue officielle dans 29 pays et l'une des 6 langues officielles de l'ONU."}, {"t": "Histoire géographie et culture", "q": "Quelle cathédrale célèbre a été en partie détruite par un incendie en 2019 ?", "a": "Notre-Dame de Paris", "wrong": ["La cathédrale de Chartres", "La basilique du Sacré-Cœur à Paris", "La cathédrale de Reims"], "explain": "Notre-Dame de Paris a été ravagée par un incendie le 15 avril 2019, qui a détruit la flèche et une grande partie de la toiture. La cathédrale a été rouverte le 7 décembre 2024 après des travaux de restauration."}, {"t": "Histoire géographie et culture", "q": "Qui était une écrivaine française célèbre ?", "a": "Simone de Beauvoir", "wrong": ["Agatha Christie", "Virginia Woolf", "Toni Morrison"], "explain": "Simone de Beauvoir (1908-1986) est une philosophe et romancière française, figure majeure de l'existentialisme et du féminisme. Son essai Le Deuxième Sexe (1949) est une œuvre fondatrice du mouvement féministe mondial."}, {"t": "Histoire géographie et culture", "q": "Qui était un célèbre musicien français ?", "a": "Claude Debussy", "wrong": ["Wolfgang Amadeus Mozart", "Ludwig van Beethoven", "Johann Sebastian Bach"], "explain": "Claude Debussy (1862-1918) est l'un des plus grands compositeurs français. Son œuvre (Clair de lune, La Mer...) a révolutionné la musique classique et fondé l'impressionnisme musical."}, {"t": "Histoire géographie et culture", "q": "Qui était Auguste Renoir ?", "a": "Un peintre impressionniste français du XIXe siècle", "wrong": ["Un sculpteur néoclassique de la cour de Louis XVI", "Un architecte qui construisit le palais de Versailles", "Un photographe pionnier du portrait en noir et blanc"], "explain": "Pierre-Auguste Renoir (1841-1919) est l'un des maîtres de l'impressionnisme français. Ses toiles, célèbres pour leur lumière et leur joie de vivre, représentent notamment des scènes de la vie parisienne."}, {"t": "Histoire géographie et culture", "q": "Quelle fête est française ?", "a": "La Chandeleur (2 février)", "wrong": ["Saint-Patrick (17 mars)", "Halloween (31 octobre)", "Thanksgiving (4e jeudi de novembre)"], "explain": "La Chandeleur, célébrée le 2 février, est une fête française d'origine chrétienne associée à la tradition de manger des crêpes. Saint-Patrick est irlandaise, Halloween américaine d'origine irlandaise, Thanksgiving américaine."}, {"t": "Vivre dans la société française", "q": "Quel mariage est reconnu par l'État ?", "a": "Le mariage civil célébré à la mairie", "wrong": ["Le mariage religieux célébré à l'église, à la mosquée ou à la synagogue", "Le mariage célébré à l'étranger uniquement", "Un simple accord oral devant deux témoins"], "explain": "En France, seul le mariage civil, célébré devant l'officier d'état civil (maire ou adjoint) à la mairie, a une valeur juridique. Le mariage religieux n'a aucun effet légal et ne peut avoir lieu qu'après le mariage civil."}, {"t": "Vivre dans la société française", "q": "Auprès de quelle institution les parents peuvent-ils inscrire leur enfant à l'école publique ?", "a": "La mairie de la commune de résidence", "wrong": ["La préfecture du département", "L'académie régionale de l'Éducation nationale", "Le conseil régional"], "explain": "Pour inscrire un enfant à l'école publique, les parents doivent d'abord s'adresser à la mairie de leur commune de résidence, qui leur délivre un certificat d'inscription. Ils se rendent ensuite directement dans l'école."}, {"t": "Vivre dans la société française", "q": "En cas de divorce, qui exerce l'autorité parentale ?", "a": "En principe, les deux parents exercent conjointement l'autorité parentale", "wrong": ["Uniquement le parent qui a la garde physique de l'enfant", "Uniquement la mère, sauf décision contraire du juge", "Le juge désigne un seul parent comme titulaire de l'autorité parentale"], "explain": "En France, le divorce ne met pas fin à l'autorité parentale conjointe. Les deux parents conservent leurs droits et obligations envers l'enfant. Le juge peut exceptionnellement confier l'autorité parentale exclusive à un seul parent."}, {"t": "Vivre dans la société française", "q": "Quelle aide permet aux personnes qui ont des difficultés financières d'avoir un avocat ?", "a": "L'aide juridictionnelle", "wrong": ["Le RSA (Revenu de Solidarité Active)", "L'allocation logement (APL)", "La prime d'activité"], "explain": "L'aide juridictionnelle est une prise en charge totale ou partielle des frais d'avocat et de justice par l'État pour les personnes dont les ressources sont insuffisantes. Elle garantit l'accès à la justice pour tous."}, {"t": "Vivre dans la société française", "q": "Où faut-il déclarer la naissance d'un enfant ?", "a": "À la mairie du lieu de naissance, dans les 5 jours", "wrong": ["À la préfecture dans les 30 jours", "Au consulat du pays d'origine des parents", "À l'hôpital, qui transmet automatiquement la déclaration"], "explain": "La naissance d'un enfant doit être déclarée à la mairie du lieu de naissance dans les 5 jours qui suivent l'accouchement (jours fériés exclus). Cette déclaration donne lieu à l'établissement d'un acte de naissance officiel."}, {"t": "Vivre dans la société française", "q": "Quelle est l'une des conditions pour passer l'examen du permis de conduire ?", "a": "Avoir 18 ans (ou 17 ans pour la conduite accompagnée)", "wrong": ["Posséder un véhicule personnel", "Avoir une adresse fixe depuis 2 ans", "Être citoyen français"], "explain": "Pour passer l'examen du permis de conduire (catégorie B), il faut avoir 18 ans ou 17 ans dans le cadre de la conduite accompagnée (AAC). Il faut aussi avoir validé l'épreuve théorique (Code de la route)."}, {"t": "Vivre dans la société française", "q": "Un bail locatif est valide s'il est :", "a": "Signé entre le propriétaire et le locataire, et mentionnant les éléments obligatoires", "wrong": ["Conclu uniquement à l'oral entre les parties", "Établi uniquement par un notaire", "Enregistré auprès des impôts dans les 15 jours"], "explain": "Un bail locatif doit être conclu par écrit et contenir des mentions obligatoires (durée, loyer, surface, identité des parties...). Un bail oral est difficile à prouver en cas de litige et ne protège pas le locataire."}, {"t": "Vivre dans la société française", "q": "Où peut-on déposer un lave-vaisselle cassé ?", "a": "En déchetterie ou lors d'une collecte de déchets encombrants", "wrong": ["Sur le trottoir devant chez soi", "Dans les poubelles ménagères ordinaires", "Dans les bacs de tri sélectif"], "explain": "Les appareils électroménagers sont des déchets encombrants. Il faut les déposer en déchetterie, les confier à un prestataire de collecte spécialisé ou les remettre au vendeur lors d'un nouvel achat."}, {"t": "Vivre dans la société française", "q": "Quel numéro d'urgence permet d'appeler la police ?", "a": "17", "wrong": ["15", "18", "112"], "explain": "Le 17 est le numéro d'urgence de la police nationale et de la gendarmerie. Il faut l'appeler en cas de crime, délit, trouble à l'ordre public ou situation dangereuse nécessitant l'intervention des forces de l'ordre."}, {"t": "Vivre dans la société française", "q": "Concernant l'accès aux soins, quelle proposition est correcte ?", "a": "Toute personne en France a droit aux soins urgents, quelle que soit sa situation", "wrong": ["Seuls les assurés sociaux peuvent consulter un médecin généraliste", "Les étrangers doivent payer intégralement leurs soins avant d'être traités", "Seuls les citoyens français ont accès aux hôpitaux publics"], "explain": "Toute personne présente sur le territoire français a accès aux soins urgents. L'Aide Médicale de l'État (AME) permet aux personnes en situation irrégulière d'accéder aux soins."}, {"t": "Vivre dans la société française", "q": "À qui est accessible la contraception ?", "a": "À toute personne qui en fait la demande, sans condition d'âge ni d'autorisation parentale pour les mineures", "wrong": ["Uniquement aux femmes mariées", "Uniquement aux personnes majeures", "Uniquement aux personnes qui ont déjà eu des enfants"], "explain": "La contraception est accessible à toutes les personnes qui en font la demande. Depuis 2022, la contraception est remboursée à 100 % pour toutes les femmes jusqu'à 25 ans. Les mineures peuvent l'obtenir sans autorisation parentale."}, {"t": "Vivre dans la société française", "q": "Qu'est-ce que le principe de confidentialité dans le domaine de la santé ?", "a": "Le secret médical : le médecin ne peut pas divulguer les informations de santé d'un patient", "wrong": ["L'obligation pour le patient de tout dire à son médecin", "Le droit de l'employeur d'accéder au dossier médical de son employé", "L'obligation pour le médecin de prévenir la famille en cas de maladie grave"], "explain": "Le secret médical est une obligation légale et déontologique : le médecin ne peut pas révéler les informations médicales de ses patients sans leur consentement, sauf exceptions prévues par la loi."}, {"t": "Vivre dans la société française", "q": "L'inscription à l'Assurance maladie est :", "a": "Obligatoire pour toute personne résidant de façon stable en France", "wrong": ["Facultative et réservée aux seuls salariés", "Uniquement pour les citoyens français et les ressortissants européens", "Payante et soumise à conditions de ressources"], "explain": "L'inscription à l'Assurance maladie (Sécurité sociale) est obligatoire pour toute personne résidant de façon stable en France. La Protection Universelle Maladie (PUMA) garantit un accès aux soins pour tous les résidents."}, {"t": "Vivre dans la société française", "q": "Qui peut demander un congé parental d'éducation ?", "a": "Tout salarié (père ou mère) ayant au moins 1 an d'ancienneté dans l'entreprise", "wrong": ["Uniquement la mère de l'enfant", "Uniquement les fonctionnaires de l'État", "Uniquement les salariés en CDI à temps plein"], "explain": "Le congé parental d'éducation est ouvert à tout salarié (père ou mère, parents adoptifs) justifiant d'une ancienneté d'au moins 1 an dans l'entreprise à la naissance ou à l'adoption de l'enfant."}, {"t": "Vivre dans la société française", "q": "Quelles sont les affaires traitées par le conseil de prud'hommes ?", "a": "Les litiges entre employeurs et salariés concernant le contrat de travail", "wrong": ["Les litiges entre locataires et propriétaires", "Les infractions routières commises par des professionnels", "Les conflits entre commerçants et consommateurs"], "explain": "Le conseil de prud'hommes est la juridiction compétente pour régler les litiges individuels liés au contrat de travail entre un employeur et un salarié (licenciement, salaires, harcèlement, discrimination...)."}, {"t": "Vivre dans la société française", "q": "Travailler sans être déclaré est :", "a": "Illégal et sanctionné pour le salarié et l'employeur", "wrong": ["Légal pour les petits travaux occasionnels entre particuliers", "Toléré si le travail ne dépasse pas 8 heures par semaine", "Autorisé pour les personnes sans titre de séjour en attendant leur régularisation"], "explain": "Le travail non déclaré (travail au noir) est illégal pour l'employeur comme pour le salarié. Il prive ce dernier de ses droits sociaux (retraite, chômage, maladie) et expose l'employeur à des sanctions pénales et financières lourdes."}, {"t": "Vivre dans la société française", "q": "Lorsqu'un employeur veut qu'un salarié travaille plus longtemps que la durée prévue dans le contrat de travail :", "a": "Il doit payer des heures supplémentaires majorées", "wrong": ["Il peut le faire librement sans obligation particulière", "Il peut déduire ce temps de futurs congés payés", "Il peut le faire si le salarié signe une décharge"], "explain": "Les heures travaillées au-delà de la durée légale (35h) ou contractuelle sont des heures supplémentaires. Elles doivent être majorées (25 % pour les 8 premières, 50 % au-delà) ou compensées par du repos."}, {"t": "Vivre dans la société française", "q": "Quelle est la mission de France Travail ?", "a": "Accompagner les demandeurs d'emploi dans leur recherche d'emploi et verser les allocations chômage", "wrong": ["Percevoir les cotisations patronales pour financer les retraites", "Contrôler les conditions de travail dans les entreprises", "Délivrer les titres de séjour aux travailleurs étrangers"], "explain": "France Travail (anciennement Pôle Emploi) accompagne les demandeurs d'emploi inscrits dans leur recherche d'emploi, leur propose des formations et verse les allocations chômage (ARE) à ceux qui y ont droit."}, {"t": "Vivre dans la société française", "q": "Dans une entreprise, le droit syndical permet :", "a": "Aux salariés de se regrouper pour défendre collectivement leurs intérêts professionnels", "wrong": ["Aux salariés de refuser individuellement tout ordre de leur supérieur", "Aux syndicats de diriger l'entreprise à la place du chef d'entreprise", "Aux syndicats de licencier des salariés qui ne les rejoignent pas"], "explain": "Le droit syndical est un droit constitutionnel. Il permet aux salariés de s'organiser collectivement au sein de syndicats pour négocier avec les employeurs les conditions de travail, les salaires et défendre leurs intérêts."}, {"t": "Vivre dans la société française", "q": "Dans une entreprise, le droit de grève autorise :", "a": "Les salariés à cesser collectivement le travail pour défendre des revendications professionnelles", "wrong": ["Les salariés à occuper les locaux de l'entreprise indéfiniment", "Un seul salarié à refuser de travailler pour des raisons personnelles", "Les grévistes à empêcher physiquement les non-grévistes de travailler"], "explain": "Le droit de grève est constitutionnel en France. Il permet aux travailleurs de cesser collectivement le travail pour défendre des revendications. Les grévistes ne peuvent cependant pas empêcher les non-grévistes de travailler."}, {"t": "Vivre dans la société française", "q": "Quelles sont les conditions pour toucher les allocations chômage ?", "a": "Avoir été salarié, avoir cotisé suffisamment longtemps, être inscrit à France Travail et rechercher activement un emploi", "wrong": ["Il suffit d'être sans emploi pour les recevoir automatiquement", "Elles sont versées à toute personne résidant en France", "Il faut avoir 50 ans ou plus pour y avoir droit"], "explain": "Pour percevoir l'ARE, il faut : avoir été salarié, avoir cotisé au moins 6 mois sur les 24 derniers mois, être inscrit à France Travail, être disponible et rechercher activement un emploi."}, {"t": "Vivre dans la société française", "q": "Qu'est-ce que l'école maternelle ?", "a": "La première étape de la scolarisation, accueillant les enfants de 3 à 6 ans", "wrong": ["Une école privée payante réservée aux enfants de moins de 3 ans", "Un établissement accueillant les enfants de 0 à 3 ans (crèche)", "Une école uniquement pour les enfants en difficulté d'apprentissage"], "explain": "L'école maternelle accueille les enfants de 3 à 6 ans (petite, moyenne et grande section). Elle est obligatoire depuis 2019 (abaissement de l'âge de l'instruction obligatoire de 6 à 3 ans). Elle est gratuite dans le public."}, {"t": "Vivre dans la société française", "q": "Comment s'appelle le diplôme passé par les élèves à la fin du collège ?", "a": "Le Diplôme National du Brevet (DNB)", "wrong": ["Le Certificat d'Études let deck=[],index=0,selected=null,score=0,mistakes={};
let mode="Questions dans l'ordre",selectedTheme=ALL_THEMES;

function normalizeText(v){return String(v??"").toLowerCase().replaceAll("'","'").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
function shuffleArray(arr){const r=[...arr];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function buildQuestion(item){return{...item,options:shuffleArray([item.a,...(item.wrong||[])])};}
function getThemes(){return[ALL_THEMES,...Array.from(new Set(questionsData.map(q=>q.t)))];}
function getQuestionsByTheme(theme){return(!theme||theme===ALL_THEMES)?questionsData:questionsData.filter(q=>q.t===theme);}
function sampleQuestions(count,theme){count=count||QUESTION_COUNT;theme=theme||ALL_THEMES;const qs=getQuestionsByTheme(theme);return qs.slice(0,Math.min(count,qs.length)).map(buildQuestion);}
function resetQuiz(nextDeck,nextMode){deck=nextDeck;index=0;selected=null;score=0;mode=nextMode;document.getElementById("quizView").style.display="block";document.getElementById("resultView").style.display="none";render();}
function renderThemes(){
  const sel=document.getElementById("themeSelect");sel.innerHTML="";
  getThemes().forEach(theme=>{
    const o=document.createElement("option");o.value=theme;
    const n=theme===ALL_THEMES?theme:theme+" ("+getQuestionsByTheme(theme).length+" q.)";
    o.textContent=n;if(theme===selectedTheme)o.selected=true;sel.appendChild(o);
  });
}
function render(){
  const cur=deck[index];if(!cur)return;
  document.getElementById("barFill").style.width=deck.length?Math.round((index/deck.length)*100)+"%":"0%";
  document.getElementById("themeTag").textContent=cur.t;
  document.getElementById("meta").textContent=mode+" · Question "+(index+1)+" / "+deck.length+" · Score : "+score;
  document.getElementById("question").textContent=cur.q;
  const opts=document.getElementById("options");opts.innerHTML="";
  cur.options.forEach(opt=>{
    const btn=document.createElement("button");btn.className="option";btn.textContent=opt;btn.disabled=Boolean(selected);
    if(selected){
      if(normalizeText(opt)===normalizeText(cur.a))btn.classList.add("correct");
      else if(normalizeText(opt)===normalizeText(selected))btn.classList.add("wrong");
    }
    btn.addEventListener("click",()=>choose(opt));opts.appendChild(btn);
  });
  const fb=document.getElementById("feedback");
  if(selected){
    fb.style.display="block";
    const ok=normalizeText(selected)===normalizeText(cur.a);
    document.getElementById("feedbackTitle").textContent=ok?"✓ Bonne réponse !":"✗ Pas tout à fait.";
    const fc=document.getElementById("feedbackCorrect");
    if(ok){fc.textContent="";fc.style.display="none";}
    else{fc.textContent="Bonne réponse : "+cur.a;fc.style.display="block";}
    document.getElementById("feedbackText").textContent=cur.explain;
    document.getElementById("nextBtn").textContent=index+1>=deck.length?"Voir le résultat":"Question suivante";
  }else{fb.style.display="none";}
  const hasErr=Object.keys(mistakes).length>0;
  document.getElementById("errorsBtn").disabled=!hasErr;
  document.getElementById("errorsBtn2").disabled=!hasErr;
}
function choose(opt){
  if(selected)return;const cur=deck[index];selected=opt;
  if(normalizeText(opt)===normalizeText(cur.a)){score++;if(mode==="Entraînement erreurs")delete mistakes[cur.q];}
  else{mistakes[cur.q]={...cur,count:(mistakes[cur.q]?.count||0)+1};}
  render();
}
function nextQuestion(){if(index+1>=deck.length){showResult();return;}index++;selected=null;render();}
function showResult(){
  document.getElementById("quizView").style.display="none";document.getElementById("resultView").style.display="block";
  const pct=deck.length?Math.round((score/deck.length)*100):0;
  document.getElementById("resultMeta").textContent="Mode : "+mode+" · Score : "+score+" / "+deck.length;
  document.getElementById("scoreBig").textContent=pct+"%";
  document.getElementById("resultMessage").textContent=
    score===deck.length?"Parfait ! Zéro erreur ! Vous êtes prêt(e) pour l'examen.":
    score>=deck.length*.8?"Excellent résultat ! Encore quelques révisions et vous serez prêt(e).":
    score>=deck.length*.6?"Bon travail ! Continuez à vous entraîner sur les points faibles.":
    "À retravailler — cliquez sur « Mes erreurs » pour cibler les questions ratées !";
  const list=document.getElementById("mistakesList");list.innerHTML="";
  const wrongList=Object.values(mistakes).sort((a,b)=>b.count-a.count);
  if(!wrongList.length){list.innerHTML='<p class="small">Aucune erreur enregistrée. Bravo !</p>';}
  else{wrongList.forEach(item=>{const div=document.createElement("div");div.className="mistake";div.innerHTML='<div class="small">'+item.t+' · erreurs : '+item.count+'</div><strong>'+item.q+'</strong><p class="correct-rep">✓ '+item.a+'</p><p class="expl">'+item.explain+'</p>';list.appendChild(div);});}
  const hasErr=wrongList.length>0;
  document.getElementById("errorsBtn").disabled=!hasErr;
  document.getElementById("errorsBtn2").disabled=!hasErr;
}
function startFirst40(){resetQuiz(sampleQuestions(QUESTION_COUNT,selectedTheme),selectedTheme===ALL_THEMES?"Questions dans l'ordre":selectedTheme);}
function startAll(){resetQuiz(shuffleArray(getQuestionsByTheme(selectedTheme).map(buildQuestion)),selectedTheme===ALL_THEMES?"Toutes les questions (aléatoire)":selectedTheme+" — toutes");}
function trainErrors(){const wl=Object.values(mistakes);if(!wl.length)return;resetQuiz(shuffleArray(wl.map(buildQuestion)),"Entraînement erreurs");}

document.getElementById("themeSelect").addEventListener("change",e=>{selectedTheme=e.target.value;resetQuiz(sampleQuestions(QUESTION_COUNT,selectedTheme),selectedTheme===ALL_THEMES?"Questions dans l'ordre":selectedTheme);});
document.getElementById("nextBtn").addEventListener("click",nextQuestion);
document.getElementById("restartBtn").addEventListener("click",startFirst40);
document.getElementById("restartBtn2").addEventListener("click",startFirst40);
document.getElementById("allBtn").addEventListener("click",startAll);
document.getElementById("allBtn2").addEventListener("click",startAll);
document.getElementById("errorsBtn").addEventListener("click",trainErrors);
document.getElementById("errorsBtn2").addEventListener("click",trainErrors);

renderThemes();
startFirst40();
</script>
