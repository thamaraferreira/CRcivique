<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Civique — Carte de Résident</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:#09090b; color:#fafafa; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { width:100%; max-width:850px; background:#18181b; border:1px solid #27272a; border-radius:22px; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.45); }
    .bar { height:8px; background:#27272a; }
    .bar-fill { height:100%; background:#fafafa; width:0%; transition:width .25s ease; }
    .content { padding:28px; }
    .top { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
    .tag { display:inline-flex; background:#27272a; color:#d4d4d8; padding:8px 12px; border-radius:999px; font-size:14px; }
    .meta { color:#a1a1aa; font-size:14px; }
    .theme-box { border:1px solid #27272a; background:#09090b; border-radius:18px; padding:14px; margin-bottom:24px; }
    label { display:block; color:#71717a; text-transform:uppercase; letter-spacing:.08em; font-size:12px; margin-bottom:8px; }
    select,button { font:inherit; }
    select { width:100%; background:#18181b; color:#fafafa; border:1px solid #3f3f46; border-radius:14px; padding:12px; outline:none; }
    h1 { font-size:clamp(22px,3vw,32px); line-height:1.2; margin:18px 0 24px; }
    .options { display:grid; gap:12px; }
    .option { width:100%; border:1px solid #3f3f46; background:#09090b; color:#fafafa; border-radius:18px; padding:16px; text-align:left; font-weight:700; cursor:pointer; transition:background .2s,border .2s; line-height:1.45; }
    .option:hover:not(:disabled) { background:#27272a; }
    .option.correct { border-color:#22c55e; background:rgba(34,197,94,.15); color:#dcfce7; }
    .option.wrong   { border-color:#ef4444; background:rgba(239,68,68,.15);  color:#fee2e2; }
    .feedback { margin-top:22px; background:#27272a; border-radius:18px; padding:18px; display:none; line-height:1.6; }
    .feedback strong { display:block; margin-bottom:6px; font-size:15px; }
    .feedback .correct-ans { color:#22c55e; font-weight:bold; margin-bottom:8px; display:block; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
    .btn { border:none; border-radius:14px; padding:12px 16px; font-weight:700; cursor:pointer; background:#fafafa; color:#09090b; }
    .btn.secondary { background:#3f3f46; color:#fafafa; }
    .btn.blue      { background:#2563eb; color:#fff; }
    .btn:disabled  { opacity:.45; cursor:not-allowed; }
    .result { display:none; padding:28px; }
    .score-big { background:#27272a; border-radius:18px; padding:20px; margin:18px 0; font-size:48px; font-weight:800; }
    .mistake { border:1px solid #27272a; background:#09090b; border-radius:14px; padding:14px; margin-top:10px; }
    .mistake .correct-rep { color:#22c55e; margin:4px 0; }
    .mistake .expl { color:#a1a1aa; font-size:13px; margin-top:4px; }
    .small { color:#a1a1aa; font-size:14px; }
    .badge { display:inline-block; background:#1d4ed8; color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  </style>
</head>
<body>
<main class="card">
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>

  <section class="content" id="quizView">
    <div class="top">
      <div class="tag" id="themeTag"></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="theme-box">
      <label for="themeSelect">Choisir une thématique</label>
      <select id="themeSelect"></select>
    </div>
    <h1 id="question"></h1>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <strong id="feedbackTitle"></strong>
      <span class="correct-ans" id="feedbackCorrect"></span>
      <div id="feedbackText"></div>
      <button class="btn" id="nextBtn" style="margin-top:14px;">Question suivante</button>
    </div>
    <div class="actions">
      <button class="btn" id="restartBtn">Recommencer</button>
      <button class="btn secondary" id="allBtn">Tout réviser</button>
      <button class="btn blue" id="errorsBtn" disabled>Mes erreurs</button>
    </div>
  </section>

  <section class="result" id="resultView">
    <h1>Résultat du quiz</h1>
    <p class="small" id="resultMeta"></p>
    <div class="score-big" id="scoreBig"></div>
    <p id="resultMessage"></p>
    <h2>Questions à retravailler</h2>
    <div id="mistakesList"></div>
    <div class="actions">
      <button class="btn" id="restartBtn2">Recommencer</button>
      <button class="btn secondary" id="allBtn2">Tout réviser</button>
      <button class="btn blue" id="errorsBtn2" disabled>Mes erreurs</button>
    </div>
  </section>
</main>

<script>
const QUESTION_COUNT = 40;
const ALL_THEMES = "Toutes les th\u00e9matiques";

const questionsData = [{"t": "Principes et valeurs", "q": "Parmi les propositions suivantes, laquelle constitue une participation citoyenne ?", "a": "Voter lors des élections", "wrong": ["Regarder les informations à la télévision", "Payer ses impôts en retard", "Refuser de faire son service national"], "explain": "La participation citoyenne consiste à s'impliquer dans la vie de la cité. Voter est l'acte civique fondamental par lequel chaque citoyen exprime sa voix dans le choix de ses représentants."}, {"t": "Principes et valeurs", "q": "Que garantit la liberté d'expression ?", "a": "Le droit d'exprimer librement ses opinions, dans le respect de la loi", "wrong": ["Le droit de dire n'importe quoi sans limite", "Le droit de publier des informations secrètes de l'État", "Le droit d'insulter sans être sanctionné"], "explain": "La liberté d'expression garantit à chacun le droit d'exprimer ses idées oralement ou par écrit. Elle est encadrée : les discours haineux, la diffamation et les menaces restent interdits et punissables."}, {"t": "Principes et valeurs", "q": "À quoi sert un titre de séjour ?", "a": "À autoriser légalement une personne étrangère à résider sur le territoire français", "wrong": ["À permettre de travailler sans déclaration à l'administration", "À obtenir automatiquement la nationalité française", "À remplacer le passeport pour voyager en Europe"], "explain": "Le titre de séjour est le document officiel qui autorise un ressortissant étranger à résider légalement en France. Il en existe différents types selon la durée et la situation de la personne."}, {"t": "Principes et valeurs", "q": "La liberté de circulation permet à toute personne de :", "a": "Se déplacer librement sur le territoire et entrer ou sortir du pays", "wrong": ["Passer une frontière sans contrôle douanier", "Conduire sans permis dans les zones rurales", "S'installer dans n'importe quel logement sans contrat"], "explain": "La liberté de circulation est un droit fondamental qui permet à chacun de se déplacer librement sur le territoire national et d'entrer ou de quitter le pays, dans le cadre des lois en vigueur."}, {"t": "Principes et valeurs", "q": "Sur quel site internet peut-on retrouver le symbole de la République française ?", "a": "Sur les sites officiels de l'État (ex : service-public.fr)", "wrong": ["Sur les sites de jeux en ligne agréés", "Sur les réseaux sociaux commerciaux uniquement", "Sur les sites des partis politiques"], "explain": "Le buste de Marianne, symbole de la République, figure sur tous les sites officiels de l'État français, identifiables par le logo « République Française » et les extensions .gouv.fr."}, {"t": "Principes et valeurs", "q": "Complétez ces paroles de la Marseillaise : « Aux armes […] ! Formez vos bataillons »", "a": "Citoyens", "wrong": ["Soldats", "Guerriers", "Camarades"], "explain": "Les paroles exactes de la Marseillaise sont : « Aux armes, citoyens ! Formez vos bataillons ! » Ce refrain symbolise l'appel à la défense de la nation par ses citoyens."}, {"t": "Principes et valeurs", "q": "Complétez les paroles de la Marseillaise : « Allons enfants de la patrie […] »", "a": "Le jour de gloire est arrivé", "wrong": ["Défendons notre liberté", "Marchons pour la République", "Levons-nous pour nos droits"], "explain": "Le premier vers de la Marseillaise est : « Allons enfants de la Patrie, le jour de gloire est arrivé ! » Composée par Rouget de Lisle en 1792, elle est l'hymne national de la France depuis 1879."}, {"t": "Principes et valeurs", "q": "En application de la liberté individuelle, quelle proposition est correcte ? Une personne peut :", "a": "Choisir librement sa religion, son mode de vie et ses opinions, dans le respect des lois", "wrong": ["Faire tout ce qu'elle veut sans aucune contrainte", "Refuser de respecter les lois qui lui déplaisent", "Imposer ses convictions personnelles à autrui"], "explain": "La liberté individuelle garantit à chacun de choisir sa façon de vivre, de croire et de penser. Elle s'exerce dans le respect des lois et des droits des autres : elle ne permet pas de nuire à autrui."}, {"t": "Principes et valeurs", "q": "Concernant la pratique de la religion, quelle proposition est correcte ?", "a": "Chacun est libre de pratiquer la religion de son choix ou de n'en avoir aucune", "wrong": ["La France impose à chaque résident de déclarer une religion", "Seules les religions reconnues par l'État peuvent être pratiquées", "La pratique religieuse est interdite en dehors des lieux de culte"], "explain": "En vertu de la laïcité et de la liberté de conscience, chaque personne est libre de pratiquer la religion de son choix ou de n'en avoir aucune. L'État ne favorise ni n'interdit aucune religion."}, {"t": "Principes et valeurs", "q": "En tant que parent, peut-on refuser que son enfant participe aux cours de sport à l'école car ils sont mixtes ?", "a": "Non, les cours sont obligatoires pour tous les élèves sans distinction", "wrong": ["Oui, si la religion de la famille l'interdit", "Oui, avec un certificat médical de complaisance", "Oui, si les deux parents signent une dérogation"], "explain": "Non. Les cours d'éducation physique sont obligatoires dans le programme scolaire. L'école républicaine est mixte et laïque ; des considérations religieuses ne peuvent pas justifier un refus de participation."}, {"t": "Principes et valeurs", "q": "Quelle est la devise de la France ?", "a": "Liberté, Égalité, Fraternité", "wrong": ["Travail, Famille, Patrie", "Unité, Paix, Justice", "Foi, Loi, Roi"], "explain": "La devise « Liberté, Égalité, Fraternité » est inscrite à l'article 2 de la Constitution. Elle figure sur les bâtiments officiels, les documents de la République et les pièces de monnaie françaises."}, {"t": "Principes et valeurs", "q": "La répudiation de sa femme est :", "a": "Interdite en France, car contraire à l'égalité entre les femmes et les hommes", "wrong": ["Autorisée si elle est effectuée devant un notaire", "Acceptée si les deux conjoints sont de même nationalité étrangère", "Reconnue en France si elle a été prononcée à l'étranger"], "explain": "La répudiation est le renvoi unilatéral de la femme par le mari sans son consentement. Elle est incompatible avec les principes d'égalité et de dignité garantis par la loi française et ne peut pas être reconnue en France."}, {"t": "Principes et valeurs", "q": "Les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?", "a": "Payer ses impôts est une obligation légale pour tous les résidents ayant des revenus", "wrong": ["Seuls les citoyens français sont tenus de payer des impôts", "On peut décider librement du montant de ses impôts", "Les impôts sont facultatifs si l'on n'utilise pas les services publics"], "explain": "Payer ses impôts est une obligation légale pour toute personne résidant en France et disposant de revenus, quelle que soit sa nationalité. Les impôts financent les services publics (école, santé, sécurité...)."}, {"t": "Principes et valeurs", "q": "Peut-on brûler publiquement un drapeau français ?", "a": "Non, c'est un délit passible de sanctions pénales", "wrong": ["Oui, au nom de la liberté d'expression artistique", "Oui, lors de manifestations politiques autorisées", "Oui, si cela ne trouble pas l'ordre public"], "explain": "Brûler ou dégrader publiquement le drapeau national est un délit en France, puni par l'article 433-5-1 du Code pénal. Cela constitue une atteinte aux symboles de la République."}, {"t": "Principes et valeurs", "q": "Que fait l'État pour lutter contre les discriminations ?", "a": "Il adopte des lois, crée des institutions comme le Défenseur des droits et sanctionne les discriminations", "wrong": ["Il laisse les entreprises s'autoréguler librement", "Il interdit uniquement les discriminations dans la fonction publique", "Il sensibilise sans adopter de sanctions légales"], "explain": "L'État lutte contre les discriminations par des lois (code pénal, code du travail), des institutions (Défenseur des droits), des campagnes de sensibilisation et des sanctions contre les employeurs ou individus discriminants."}, {"t": "Principes et valeurs", "q": "Que représente Marianne ?", "a": "Le symbole de la République française : la liberté et la raison", "wrong": ["La patronne catholique de la France", "La première femme élue à la présidence", "Une héroïne de la Résistance pendant la Seconde Guerre mondiale"], "explain": "Marianne est le symbole officiel de la République française. Elle représente la liberté et la raison. Son buste figure dans toutes les mairies et sur les documents officiels de la République."}, {"t": "Principes et valeurs", "q": "Qu'est-ce que la liberté d'association ?", "a": "Le droit de se regrouper avec d'autres personnes pour défendre des intérêts communs", "wrong": ["Le droit de créer une entreprise commerciale sans formalités", "Le droit de refuser d'adhérer à un syndicat", "Le droit de se regrouper uniquement avec des citoyens français"], "explain": "La liberté d'association (loi de 1901) permet à toute personne de se regrouper librement avec d'autres pour poursuivre un but commun non lucratif (sportif, culturel, humanitaire, défense de droits...)."}, {"t": "Principes et valeurs", "q": "Qu'est-ce que la liberté ?", "a": "Le droit de faire tout ce qui ne nuit pas à autrui, dans le respect des lois", "wrong": ["Le droit de faire absolument tout ce que l'on veut", "L'absence totale de règles et d'obligations", "Le droit de refuser les décisions de justice"], "explain": "Selon la Déclaration des droits de l'homme de 1789, « la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui ». La liberté s'exerce dans le cadre de la loi et dans le respect des droits d'autrui."}, {"t": "Principes et valeurs", "q": "Qu'est-ce que la Marseillaise ?", "a": "L'hymne national français", "wrong": ["La marche militaire jouée uniquement pendant les guerres", "Un chant régional de la ville de Marseille", "Le nom du défilé du 14 juillet à Paris"], "explain": "La Marseillaise est l'hymne national de la France depuis 1879. Composée en 1792 par Rouget de Lisle, elle est chantée lors des cérémonies officielles et des compétitions sportives internationales."}, {"t": "Principes et valeurs", "q": "Sur quel document peut-on voir Marianne ?", "a": "Sur le timbre-poste et les documents officiels de la République", "wrong": ["Uniquement sur les billets de banque en euros", "Sur les pièces de monnaie américaines", "Sur le drapeau national"], "explain": "Marianne figure sur les timbres-poste français, les sceaux de l'État, les documents officiels et les frontons des mairies. C'est le symbole le plus répandu de la République française."}, {"t": "Principes et valeurs", "q": "Un employeur refuse d'embaucher des femmes dans son entreprise. Que dit la loi ?", "a": "C'est interdit : une telle discrimination est un délit passible de sanctions pénales", "wrong": ["C'est autorisé si l'employeur peut en justifier le motif économique", "C'est toléré dans certains secteurs comme la sécurité privée", "C'est autorisé pour les petites entreprises de moins de 10 salariés"], "explain": "Le refus d'embauche fondé sur le sexe est une discrimination illégale, punie par le code pénal (jusqu'à 3 ans d'emprisonnement et 45 000 € d'amende). Le principe d'égalité entre femmes et hommes s'impose à tous les employeurs."}, {"t": "Principes et valeurs", "q": "Une des valeurs de la devise républicaine est l'égalité. Qu'est-ce que cela signifie ?", "a": "Tous les citoyens ont les mêmes droits et sont traités de la même façon par la loi", "wrong": ["Tout le monde doit gagner le même salaire", "Les hommes et les femmes doivent avoir les mêmes professions", "Chaque région doit recevoir le même financement de l'État"], "explain": "L'égalité signifie que la loi s'applique de la même façon à tous, sans discrimination de sexe, d'origine, de religion ou de fortune. C'est une égalité de droits devant la loi, pas une égalité de revenus."}, {"t": "Principes et valeurs", "q": "Quelle est la place de la langue française dans la République ?", "a": "C'est la langue officielle de la République, selon l'article 2 de la Constitution", "wrong": ["Elle est officiellement égale aux langues régionales", "Elle est obligatoire uniquement dans les écoles publiques", "Elle est recommandée mais pas imposée par la loi"], "explain": "L'article 2 de la Constitution dispose que « la langue de la République est le français ». Tous les actes officiels, procédures judiciaires et documents administratifs doivent être rédigés en français."}, {"t": "Principes et valeurs", "q": "Quels sont des symboles officiels de la République française ?", "a": "Le drapeau tricolore, la Marseillaise, Marianne et la devise", "wrong": ["La fleur de lys, le sceptre royal et la couronne", "L'aigle impérial, la croix de Lorraine et le bouclier", "Le trèfle, la harpe et l'épée de justice"], "explain": "Les symboles officiels de la République française sont : le drapeau bleu-blanc-rouge, la Marseillaise (hymne), Marianne (symbole féminin), la devise « Liberté, Égalité, Fraternité » et le coq gaulois."}, {"t": "Principes et valeurs", "q": "A-t-on le droit d'insulter publiquement quelqu'un parce qu'il est différent (handicap, apparence physique, sexe…) ?", "a": "Non, c'est une discrimination punie par la loi", "wrong": ["Oui, la liberté d'expression le permet toujours", "Oui, si cela est dit en dehors des réseaux sociaux", "Oui, entre personnes qui se connaissent"], "explain": "Non. Insulter quelqu'un publiquement en raison de son handicap, de son apparence, de son sexe ou de son origine est un délit pénal en France. La liberté d'expression ne protège pas les propos discriminatoires."}, {"t": "Principes et valeurs", "q": "Le régime de la France est :", "a": "Une République", "wrong": ["Une monarchie constitutionnelle", "Une fédération d'États autonomes", "Une théocratie"], "explain": "La France est une République depuis 1870. L'article 1er de la Constitution dispose que « la France est une République indivisible, laïque, démocratique et sociale ». Il n'y a pas de roi ou d'empereur héréditaire."}, {"t": "Principes et valeurs", "q": "Pourquoi le principe de laïcité doit-il être respecté à l'école ?", "a": "Pour garantir l'égalité entre tous les élèves et la neutralité de l'espace scolaire", "wrong": ["Pour obliger tous les élèves à être athées", "Pour interdire l'enseignement de l'histoire des religions", "Pour empêcher les parents de contacter les enseignants"], "explain": "La laïcité à l'école garantit que tous les élèves sont traités de façon égale, quelle que soit leur religion. L'espace scolaire est neutre et protégé de toute pression religieuse ou communautaire."}, {"t": "Principes et valeurs", "q": "En quelle année la loi de séparation des Églises et de l'État a-t-elle été votée ?", "a": "1905", "wrong": ["1789", "1848", "1958"], "explain": "La loi du 9 décembre 1905 a séparé les Églises et l'État en France. Elle est le fondement juridique de la laïcité : l'État ne reconnaît, ne subventionne ni ne salarie aucun culte."}, {"t": "Principes et valeurs", "q": "Une personne a-t-elle le droit de ne pas croire en une religion ?", "a": "Oui, la liberté de conscience garantit ce droit", "wrong": ["Non, chaque résident doit déclarer une religion à la préfecture", "Non, il faut appartenir à une religion pour obtenir des droits", "Oui, uniquement pour les personnes nées en France"], "explain": "Oui. La liberté de conscience, garantie par la laïcité, permet à chacun de ne pratiquer aucune religion, d'être athée ou agnostique, sans subir de discrimination ni d'obligation de la part de l'État."}, {"t": "Principes et valeurs", "q": "Quel droit est garanti par la laïcité ?", "a": "La liberté de conscience : le droit de croire ou de ne pas croire", "wrong": ["Le droit de vote réservé aux non-croyants", "L'interdiction de tout signe religieux dans la vie privée", "Le droit de refuser de payer des impôts pour raison religieuse"], "explain": "La laïcité garantit la liberté de conscience : chacun est libre de croire ou non, de pratiquer une religion ou d'en changer, sans subir de pression ou de discrimination de la part de l'État ou d'autres citoyens."}, {"t": "Principes et valeurs", "q": "À l'école publique, qui peut porter des signes religieux très visibles ?", "a": "Personne : les signes religieux ostensibles sont interdits à l'école publique", "wrong": ["Les enseignants en dehors de leurs heures de cours", "Les élèves pratiquant une religion reconnue par l'État", "Les parents accompagnateurs lors des sorties scolaires"], "explain": "La loi du 15 mars 2004 interdit le port de signes ou tenues manifestant ostensiblement une appartenance religieuse dans les écoles, collèges et lycées publics. Cette règle s'applique à tous les élèves."}, {"t": "Principes et valeurs", "q": "Selon le principe de laïcité, que signifie la neutralité de l'État ?", "a": "L'État ne favorise ni ne combat aucune religion et traite tous les citoyens de la même façon", "wrong": ["L'État interdit toute pratique religieuse en dehors des lieux de culte", "L'État impose à tous les citoyens d'être athées", "L'État reconnaît officiellement trois religions principales"], "explain": "La neutralité de l'État signifie qu'il ne prend parti pour aucune religion, ne favorise aucune croyance et traite tous les citoyens de façon égale, quelle que soit leur appartenance religieuse ou spirituelle."}, {"t": "Principes et valeurs", "q": "Que peut faire un usager du service public dans une mairie ?", "a": "Exprimer sa religion par des signes discrets sans que cela pose de problème", "wrong": ["Porter des signes religieux ostensibles car il n'est pas agent de l'État", "Refuser d'être servi par un agent de l'autre sexe", "Demander à être reçu uniquement par un agent de sa religion"], "explain": "Un usager du service public n'est pas soumis au devoir de neutralité imposé aux agents. Il peut exprimer sa religion de façon discrète. Mais il ne peut pas exiger un traitement différencié fondé sur la religion."}, {"t": "Principes et valeurs", "q": "Qui doit respecter le principe de neutralité religieuse dans une préfecture ?", "a": "Les agents publics (fonctionnaires et agents de l'État)", "wrong": ["Tous les usagers qui se rendent à la préfecture", "Uniquement les agents d'accueil au guichet", "Uniquement les agents portant un uniforme officiel"], "explain": "Le principe de neutralité religieuse s'impose à tous les agents publics dans l'exercice de leurs fonctions. Ils ne peuvent pas arborer de signes religieux visibles lorsqu'ils sont en service."}, {"t": "Principes et valeurs", "q": "La laïcité impose-t-elle aux agents publics d'être neutres vis-à-vis des usagers ?", "a": "Oui, les agents publics doivent traiter tous les usagers de la même façon, sans distinction religieuse", "wrong": ["Non, les agents peuvent refuser de servir certaines personnes pour des raisons personnelles", "Non, les agents pratiquants peuvent porter leurs signes religieux en service", "Oui, mais uniquement dans les grands services publics nationaux"], "explain": "Oui. Les agents publics sont tenus à la neutralité dans l'exercice de leurs fonctions : ils doivent traiter tous les usagers de façon égale et ne peuvent pas manifester leurs convictions religieuses en service."}, {"t": "Principes et valeurs", "q": "Que garantit le principe de laïcité ?", "a": "La liberté de conscience pour tous et la neutralité de l'État vis-à-vis des religions", "wrong": ["L'obligation pour les étrangers d'adopter la culture française", "L'interdiction de toute référence religieuse dans la vie privée", "La primauté de la culture chrétienne dans l'espace public"], "explain": "La laïcité garantit deux choses : la liberté de conscience (chacun croit ou ne croit pas librement) et la neutralité de l'État (il ne favorise ni ne combat aucune religion)."}, {"t": "Principes et valeurs", "q": "A-t-on le droit de changer de religion ?", "a": "Oui, la liberté de conscience et de religion le garantit", "wrong": ["Non, on est lié à la religion inscrite sur son acte de naissance", "Non, il faut une autorisation du tribunal", "Oui, mais seulement une fois dans sa vie"], "explain": "Oui. La liberté de conscience et de religion est un droit fondamental en France. Chacun peut choisir sa religion, en changer, pratiquer plusieurs croyances ou n'en avoir aucune, sans contrainte légale."}, {"t": "Principes et valeurs", "q": "Que représente la laïcité ?", "a": "La séparation de l'État et des religions, garantissant la liberté de conscience pour tous", "wrong": ["L'interdiction de pratiquer une religion sur le sol français", "L'obligation d'adopter les valeurs de la culture majoritaire", "La reconnaissance officielle de toutes les religions par l'État"], "explain": "La laïcité est le principe de séparation de l'État et des religions, fondé sur la loi de 1905. Elle garantit la liberté de conscience, la neutralité de l'État et l'égalité de traitement de tous, quelle que soit leur croyance."}, {"t": "Principes et valeurs", "q": "Qu'est-ce qui est interdit par la Charte de la laïcité à l'école ?", "a": "Le port de signes religieux ostensibles par les élèves", "wrong": ["L'enseignement de l'histoire des religions dans les cours", "La présence d'élèves de confessions différentes dans la même classe", "Les discussions sur la religion entre élèves en dehors des cours"], "explain": "La Charte de la laïcité à l'école, affichée dans tous les établissements, interdit aux élèves le port de signes ou tenues par lesquels ils manifestent ostensiblement leur appartenance à une religion."}, {"t": "Principes et valeurs", "q": "Que dit l'article 1er de la Constitution française ?", "a": "La France est une République indivisible, laïque, démocratique et sociale", "wrong": ["La France est une monarchie constitutionnelle fondée sur le droit divin", "La France est un État fédéral composé de régions autonomes", "La France est une République dont la langue officielle est le français et le latin"], "explain": "L'article 1er de la Constitution de 1958 dispose : « La France est une République indivisible, laïque, démocratique et sociale. Elle assure l'égalité devant la loi de tous les citoyens. »"}, {"t": "Système institutionnel et politique", "q": "Qu'est-ce que l'État de droit ?", "a": "Un système dans lequel l'État et tous les citoyens sont soumis à la loi", "wrong": ["Un système où l'État peut agir sans contrainte légale", "Un régime où les lois sont créées par un seul dirigeant", "Un système où seules les personnes riches ont accès à la justice"], "explain": "L'État de droit est un système dans lequel toute personne, qu'il s'agisse d'un simple citoyen ou de l'État lui-même, est soumise au respect des lois. Il garantit les droits fondamentaux et l'indépendance de la justice."}, {"t": "Système institutionnel et politique", "q": "Le président de la République a commis un crime. Quelle proposition est correcte ?", "a": "Il peut être destitué puis jugé comme tout citoyen", "wrong": ["Il bénéficie d'une immunité définitive et totale", "Il ne peut être jugé que par lui-même", "Il est automatiquement acquitté à la fin de son mandat"], "explain": "Nul n'est au-dessus des lois. Le Président peut être destitué par la Haute Cour (réunion des deux chambres du Parlement) en cas de manquement manifestement incompatible avec ses fonctions, puis jugé."}, {"t": "Système institutionnel et politique", "q": "La loi est l'expression de :", "a": "La volonté générale, votée par le Parlement", "wrong": ["La volonté personnelle du président de la République", "Les décisions des juges de la Cour suprême", "Les ordres du gouvernement non soumis au vote"], "explain": "Selon Rousseau et la tradition républicaine française, la loi exprime la volonté générale. Elle est votée par le Parlement (Assemblée nationale et Sénat), représentant du peuple souverain."}, {"t": "Système institutionnel et politique", "q": "Quelle est la durée du mandat du conseil municipal et du maire ?", "a": "6 ans", "wrong": ["4 ans", "5 ans", "7 ans"], "explain": "Les conseillers municipaux et le maire sont élus pour 6 ans lors des élections municipales. C'est à l'issue de ces élections que le conseil municipal élit le maire parmi ses membres."}, {"t": "Système institutionnel et politique", "q": "Que garantit l'État de droit ?", "a": "L'égalité de tous devant la loi et la protection des droits fondamentaux", "wrong": ["Le droit des plus forts à gouverner sans contrôle", "La possibilité pour l'État d'agir sans contrôle judiciaire", "L'application différente des lois selon la richesse des citoyens"], "explain": "L'État de droit garantit que toute action de l'État et de ses agents doit être conforme à la loi. Il assure l'égalité de tous devant la loi et la protection des droits et libertés fondamentaux."}, {"t": "Système institutionnel et politique", "q": "Une personne peut-elle voter à la place d'une autre ?", "a": "Non, le vote est personnel et secret", "wrong": ["Oui, avec une procuration signée devant n'importe quel témoin", "Oui, si la personne est malade et ne peut pas se déplacer", "Oui, pour les membres de la même famille"], "explain": "Le vote est personnel : chaque électeur doit voter en son nom propre. Il existe la procuration (voter pour quelqu'un d'autre), mais elle est strictement encadrée et doit être établie devant les autorités compétentes."}, {"t": "Système institutionnel et politique", "q": "Est-ce que le vote est obligatoire ?", "a": "Non, le vote est un droit, pas une obligation légale en France", "wrong": ["Oui, tout citoyen majeur a l'obligation légale de voter", "Oui, sous peine d'une amende de 150 euros", "Oui, mais uniquement pour les élections présidentielles"], "explain": "En France, le vote n'est pas obligatoire. C'est un droit et un acte civique, mais pas une obligation légale. L'abstention n'est pas sanctionnée, contrairement à certains pays comme la Belgique ou le Luxembourg."}, {"t": "Système institutionnel et politique", "q": "À la fin de son mandat, le président de la République peut-il décider de rester au pouvoir ?", "a": "Non, il doit quitter ses fonctions à l'expiration de son mandat", "wrong": ["Oui, si sa popularité est supérieure à 50 %", "Oui, en cas de crise nationale grave", "Oui, si le Parlement le lui demande"], "explain": "Non. Le mandat présidentiel est de 5 ans. À son terme, le Président doit quitter ses fonctions. Un Président ne peut exercer que deux mandats consécutifs. Rester au pouvoir au-delà serait anticonstitutionnel."}, {"t": "Système institutionnel et politique", "q": "Qui dirige l'action du Gouvernement ?", "a": "Le Premier ministre", "wrong": ["Le Président de la République seul", "Le ministre de l'Intérieur", "Le Président de l'Assemblée nationale"], "explain": "Selon l'article 21 de la Constitution, le Premier ministre dirige l'action du gouvernement. Il coordonne le travail des ministres et assure l'exécution des lois, sous l'autorité du Président de la République."}, {"t": "Système institutionnel et politique", "q": "Qui nomme le Premier ministre ?", "a": "Le président de la République", "wrong": ["Le Parlement après un vote", "Le Conseil constitutionnel", "Le Conseil d'État"], "explain": "C'est le Président de la République qui nomme le Premier ministre (article 8 de la Constitution). Il choisit généralement le chef de la majorité parlementaire pour garantir une gouvernance efficace."}, {"t": "Système institutionnel et politique", "q": "Quelle est l'organisation administrative de la France ?", "a": "La France est divisée en communes, départements et régions", "wrong": ["La France est un État fédéral composé d'États autonomes", "La France est divisée en cantons, provinces et États", "La France n'a pas de découpage administratif territorial"], "explain": "La France est une République unitaire décentralisée. Son organisation administrative comprend trois niveaux : les communes (plus de 35 000), les départements (101) et les régions (18 dont 5 en outre-mer)."}, {"t": "Système institutionnel et politique", "q": "Qu'est-ce que le pouvoir législatif ? Le pouvoir :", "a": "De voter les lois", "wrong": ["D'appliquer et faire respecter les lois", "De juger et sanctionner les infractions", "De nommer les ambassadeurs et préfets"], "explain": "Le pouvoir législatif est le pouvoir de faire la loi. Il est exercé par le Parlement (Assemblée nationale et Sénat). Les élus débattent et votent les textes qui s'appliquent à tous sur le territoire."}, {"t": "Système institutionnel et politique", "q": "Pourquoi séparer les trois pouvoirs dans une démocratie ?", "a": "Pour éviter les abus de pouvoir et garantir les libertés des citoyens", "wrong": ["Pour rendre les décisions plus longues à prendre", "Pour permettre à chaque pouvoir d'agir sans contrôle", "Pour concentrer les décisions importantes dans les mains d'un seul organe"], "explain": "La séparation des pouvoirs (Montesquieu, 1748) empêche qu'un seul organe cumule tous les pouvoirs. Elle garantit des contre-pouvoirs : le Parlement contrôle le gouvernement, la justice est indépendante."}, {"t": "Système institutionnel et politique", "q": "Qui sanctionne l'auteur d'un vol ?", "a": "La justice (le tribunal correctionnel)", "wrong": ["Le préfet du département", "Le maire de la commune", "La police nationale"], "explain": "C'est la justice (les tribunaux) qui sanctionne les auteurs d'infractions. Pour un vol (délit), c'est le tribunal correctionnel qui statue et prononce la condamnation. La police arrête et enquête, mais ne condamne pas."}, {"t": "Système institutionnel et politique", "q": "Quel est le rôle du gouvernement ?", "a": "Déterminer et conduire la politique de la nation, et appliquer les lois", "wrong": ["Voter les lois et adopter le budget de l'État", "Rendre la justice au nom du peuple français", "Élire le Président de la République"], "explain": "Selon l'article 20 de la Constitution, le gouvernement détermine et conduit la politique de la nation. Il est responsable devant le Parlement et dispose de l'administration et de la force armée."}, {"t": "Système institutionnel et politique", "q": "Que se passe-t-il si un ministre ne respecte pas la loi ?", "a": "Il peut être jugé et sanctionné comme tout citoyen", "wrong": ["Il bénéficie d'une immunité totale pendant son mandat", "Il est simplement démissionné sans autre procédure", "Il se juge lui-même devant le Conseil des ministres"], "explain": "Personne n'est au-dessus des lois. Un ministre qui commet une infraction dans l'exercice de ses fonctions peut être jugé par la Cour de justice de la République, puis sanctionné comme tout citoyen."}, {"t": "Système institutionnel et politique", "q": "Combien de députés composent l'Assemblée nationale ?", "a": "577", "wrong": ["348", "246", "700"], "explain": "L'Assemblée nationale compte 577 députés, élus pour 5 ans au suffrage universel direct. C'est la chambre basse du Parlement. Le Sénat en compte 348, élus au suffrage indirect pour 6 ans."}, {"t": "Système institutionnel et politique", "q": "Qui peut voter aux élections en France ?", "a": "Les citoyens français majeurs inscrits sur les listes électorales", "wrong": ["Toute personne résidant en France quelle que soit sa nationalité", "Les personnes majeures possédant un titre de séjour", "Les ressortissants européens pour toutes les élections"], "explain": "Peuvent voter aux élections nationales et régionales les citoyens français majeurs inscrits sur les listes électorales. Les citoyens européens peuvent voter aux élections municipales et européennes."}, {"t": "Système institutionnel et politique", "q": "Pour combien de temps sont élus les sénateurs ?", "a": "6 ans", "wrong": ["4 ans", "5 ans", "9 ans"], "explain": "Les sénateurs sont élus pour 6 ans au suffrage universel indirect. Le Sénat est renouvelé par moitié tous les 3 ans, assurant ainsi une certaine continuité dans la chambre haute du Parlement."}, {"t": "Système institutionnel et politique", "q": "La séparation des pouvoirs est un principe fondamental. Quels sont les trois pouvoirs concernés ?", "a": "Le pouvoir exécutif, le pouvoir législatif et le pouvoir judiciaire", "wrong": ["Le pouvoir local, le pouvoir national et le pouvoir européen", "La police, l'armée et la justice", "Le Président, le Premier ministre et le Parlement"], "explain": "La théorie de la séparation des pouvoirs distingue : le législatif (Parlement : vote les lois), l'exécutif (gouvernement : applique les lois), le judiciaire (tribunaux : rend la justice)."}, {"t": "Système institutionnel et politique", "q": "Est-ce que le président de la République a tous les pouvoirs ?", "a": "Non, les pouvoirs sont séparés entre le Président, le Parlement et la justice", "wrong": ["Oui, il peut gouverner seul par décret en toutes circonstances", "Oui, il peut dissoudre les tribunaux si nécessaire", "Oui, il cumule les pouvoirs exécutif et législatif"], "explain": "Non. Les pouvoirs sont séparés : le Parlement vote les lois, le gouvernement les applique et les tribunaux font respecter le droit. Le Président partage le pouvoir exécutif avec le Premier ministre."}, {"t": "Système institutionnel et politique", "q": "Qui est le préfet ?", "a": "Le représentant de l'État dans le département", "wrong": ["Le chef du conseil départemental élu", "Le président du tribunal administratif", "Le maire du chef-lieu du département"], "explain": "Le préfet est un haut fonctionnaire nommé par le Président de la République en Conseil des ministres. Il représente l'État dans le département, veille à l'application des lois et coordonne les services de l'État."}, {"t": "Système institutionnel et politique", "q": "Quelle condition est nécessaire pour voter aux élections ?", "a": "Être inscrit sur les listes électorales", "wrong": ["Être propriétaire d'un bien immobilier en France", "Avoir un emploi et payer des impôts", "Être diplômé d'un niveau minimum"], "explain": "Pour voter, il faut être citoyen français (ou européen pour certaines élections), avoir 18 ans, jouir de ses droits civiques et être inscrit sur les listes électorales de sa commune."}, {"t": "Système institutionnel et politique", "q": "Qui dirige la commune ?", "a": "Le maire", "wrong": ["Le préfet", "Le conseiller régional", "Le sous-préfet"], "explain": "La commune est dirigée par le maire, élu par le conseil municipal lors de sa première réunion après les élections. Le maire est à la fois chef de l'exécutif local et représentant de l'État dans la commune."}, {"t": "Système institutionnel et politique", "q": "Quel est le régime politique de la France aujourd'hui ?", "a": "Une République démocratique", "wrong": ["Une monarchie constitutionnelle", "Une dictature présidentielle", "Un régime d'assemblée"], "explain": "La France est une République démocratique depuis 1870 (IIIe République). La Ve République, fondée en 1958, est un régime semi-présidentiel : le Président est élu au suffrage universel direct."}, {"t": "Système institutionnel et politique", "q": "Qu'est-ce que l'Hôtel de Matignon ?", "a": "La résidence officielle et le lieu de travail du Premier ministre", "wrong": ["Le palais officiel du Président de la République", "Le siège de l'Assemblée nationale", "La résidence du Président du Sénat"], "explain": "L'Hôtel de Matignon, situé dans le 7e arrondissement de Paris, est la résidence officielle et le bureau du Premier ministre. Le Président de la République réside à l'Élysée."}, {"t": "Système institutionnel et politique", "q": "Le Parlement est composé :", "a": "De l'Assemblée nationale et du Sénat", "wrong": ["Du gouvernement et du Conseil d'État", "Du Président de la République et des ministres", "Des présidents de région et des maires"], "explain": "Le Parlement est bicaméral : il est composé de l'Assemblée nationale (577 députés, chambre basse) et du Sénat (348 sénateurs, chambre haute). Ensemble, ils exercent le pouvoir législatif."}, {"t": "Système institutionnel et politique", "q": "Quel est le rôle du président de la République ?", "a": "Garantir le fonctionnement des institutions, être garant de l'indépendance nationale", "wrong": ["Voter les lois et adopter le budget national", "Juger en appel les décisions des tribunaux", "Diriger directement tous les ministères"], "explain": "Le Président de la République veille au respect de la Constitution, assure la continuité de l'État, nomme le Premier ministre, préside le Conseil des ministres et est garant de l'indépendance nationale."}, {"t": "Système institutionnel et politique", "q": "Quel est le rôle du Premier ministre ?", "a": "Diriger l'action du gouvernement et assurer l'exécution des lois", "wrong": ["Présider les séances de l'Assemblée nationale", "Nommer les membres du Conseil constitutionnel", "Décider seul de la politique étrangère de la France"], "explain": "Le Premier ministre dirige l'action du gouvernement (article 21 de la Constitution). Il coordonne le travail des ministres, assure l'exécution des lois et répond de son action devant l'Assemblée nationale."}, {"t": "Système institutionnel et politique", "q": "Qui est le chef du Gouvernement ?", "a": "Le Premier ministre", "wrong": ["Le Président de la République", "Le Président de l'Assemblée nationale", "Le ministre de l'Intérieur"], "explain": "Le Premier ministre est le chef du gouvernement. Il dirige, coordonne et anime l'action des ministres. Il est nommé par le Président de la République et responsable devant l'Assemblée nationale."}, {"t": "Système institutionnel et politique", "q": "Combien y a-t-il de régions en France ?", "a": "18 (dont 5 en outre-mer)", "wrong": ["13", "22", "27"], "explain": "La France compte 18 régions : 13 en France métropolitaine (depuis la réforme de 2016) et 5 régions d'outre-mer (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte)."}, {"t": "Système institutionnel et politique", "q": "Quel est le rôle du Défenseur des droits ?", "a": "Défendre les droits des citoyens face aux administrations et lutter contre les discriminations", "wrong": ["Défendre les intérêts de l'État devant les tribunaux", "Contrôler la constitutionnalité des lois", "Nommer les magistrats des tribunaux administratifs"], "explain": "Le Défenseur des droits est une autorité constitutionnelle indépendante chargée de défendre les droits des usagers face aux services publics, de lutter contre les discriminations et de protéger les lanceurs d'alerte."}, {"t": "Système institutionnel et politique", "q": "Depuis quand l'euro est-elle la monnaie unique ?", "a": "Depuis le 1er janvier 2002 pour les billets et pièces en France", "wrong": ["Depuis le 1er janvier 1995", "Depuis le traité de Rome en 1957", "Depuis le 1er janvier 2010"], "explain": "L'euro est devenu la monnaie scripturale (bancaire) au 1er janvier 1999. Les billets et pièces en euros ont été mis en circulation le 1er janvier 2002, remplaçant le franc français."}, {"t": "Système institutionnel et politique", "q": "Quel est le rôle principal du département ?", "a": "Gérer les services sociaux, les routes départementales et les collèges", "wrong": ["Gérer les lycées et les universités publiques", "Définir les lois applicables à son territoire", "Percevoir la taxe sur la valeur ajoutée (TVA)"], "explain": "Le département est une collectivité territoriale chargée de l'aide sociale (RSA, aide aux personnes âgées, aux handicapés), des routes départementales et de la construction et gestion des collèges."}, {"t": "Système institutionnel et politique", "q": "Quel est le rôle principal des communes ?", "a": "Gérer les services de proximité : état civil, école primaire, voirie communale", "wrong": ["Gérer les hôpitaux et les cliniques privées", "Adopter les lois locales s'appliquant à leurs habitants", "Percevoir les impôts nationaux sur leur territoire"], "explain": "Les communes gèrent les services de proximité : état civil (naissance, mariage, décès), école primaire, voirie communale, urbanisme, action sociale locale et animation culturelle."}, {"t": "Système institutionnel et politique", "q": "Combien de communes environ existe-t-il en France ?", "a": "Environ 35 000", "wrong": ["Environ 10 000", "Environ 100 000", "Environ 3 000"], "explain": "La France compte environ 35 000 communes, ce qui en fait le pays le plus morcelé d'Europe en termes de communes. La moitié de ces communes ont moins de 500 habitants."}, {"t": "Système institutionnel et politique", "q": "Quel traité concerne la construction de l'Union européenne ?", "a": "Le traité de Maastricht (1992)", "wrong": ["Le traité de Versailles (1919)", "Le traité de Paris (1814)", "Le traité de Rome (1957) uniquement"], "explain": "Le traité de Maastricht, signé le 7 février 1992, a fondé l'Union européenne. Il a créé la citoyenneté européenne, défini les critères de convergence économique et préparé la création de la monnaie unique."}, {"t": "Système institutionnel et politique", "q": "Quel État a quitté l'Union européenne en 2020 ?", "a": "Le Royaume-Uni", "wrong": ["La Norvège", "La Suisse", "La Turquie"], "explain": "Le Royaume-Uni a quitté l'Union européenne le 31 janvier 2020 (Brexit), après un référendum en juin 2016 où 52 % des Britanniques avaient voté pour la sortie de l'UE."}, {"t": "Système institutionnel et politique", "q": "Quelle est la devise de l'Union européenne ?", "a": "Unie dans la diversité", "wrong": ["Liberté, Égalité, Fraternité", "Ensemble pour la paix", "En avant vers l'Europe"], "explain": "La devise de l'Union européenne est « Unie dans la diversité ». Elle exprime l'idée que les pays européens, tout en restant différents, travaillent ensemble pour la paix et la prospérité."}, {"t": "Système institutionnel et politique", "q": "Quel est l'hymne de l'Union européenne ?", "a": "L'Ode à la joie (9e symphonie de Beethoven)", "wrong": ["La Marseillaise", "L'Internationale", "La Brabançonne"], "explain": "L'hymne de l'UE est l'Ode à la joie, tiré du 4e mouvement de la 9e symphonie de Ludwig van Beethoven. Il est joué lors des cérémonies officielles de l'Union européenne depuis 1985."}, {"t": "Système institutionnel et politique", "q": "De quoi est composé le drapeau européen ?", "a": "D'un cercle de 12 étoiles jaunes sur fond bleu", "wrong": ["De 27 étoiles représentant les États membres sur fond blanc", "De 12 bandes horizontales bleues et jaunes alternées", "Des drapeaux de tous les États membres superposés"], "explain": "Le drapeau européen représente un cercle de 12 étoiles jaunes sur fond bleu. Le nombre 12 symbolise la perfection et n'a pas été modifié malgré l'élargissement de l'Union. Il a été adopté en 1985."}, {"t": "Système institutionnel et politique", "q": "De quelle couleur est le drapeau européen ?", "a": "Bleu avec des étoiles jaunes", "wrong": ["Rouge avec des étoiles blanches", "Blanc avec des étoiles bleues", "Vert avec des étoiles dorées"], "explain": "Le drapeau européen est bleu avec un cercle de 12 étoiles dorées (jaunes). Il a été créé en 1955 par le Conseil de l'Europe et adopté par la CEE puis l'UE comme symbole officiel en 1985."}, {"t": "Système institutionnel et politique", "q": "En quelle année le traité de Maastricht a-t-il été signé ?", "a": "1992", "wrong": ["1957", "1985", "2004"], "explain": "Le traité de Maastricht a été signé le 7 février 1992 et est entré en vigueur le 1er novembre 1993. Il a transformé la Communauté économique européenne (CEE) en Union européenne (UE)."}, {"t": "Système institutionnel et politique", "q": "Où est le siège du Parlement européen ?", "a": "À Strasbourg (siège officiel) et Bruxelles (travaux en commission)", "wrong": ["Uniquement à Bruxelles, en Belgique", "À Luxembourg, au Grand-Duché de Luxembourg", "À Berlin, en Allemagne"], "explain": "Le Parlement européen a son siège officiel à Strasbourg, en France, où se tiennent les sessions plénières. Les commissions parlementaires travaillent essentiellement à Bruxelles."}, {"t": "Système institutionnel et politique", "q": "Où est le siège de la Commission européenne ?", "a": "À Bruxelles, en Belgique", "wrong": ["À Strasbourg, en France", "À Luxembourg", "À Genève, en Suisse"], "explain": "Le siège de la Commission européenne est à Bruxelles, en Belgique. C'est l'organe exécutif de l'UE, chargé de proposer les législations et de veiller à l'application des traités européens."}, {"t": "Système institutionnel et politique", "q": "Quel État n'est pas membre de l'Union européenne ?", "a": "La Suisse", "wrong": ["La Suède", "La Finlande", "L'Autriche"], "explain": "La Suisse n'est pas membre de l'Union européenne. Elle a refusé par référendum d'adhérer à l'Espace économique européen en 1992 et a maintenu son statut de neutralité politique."}, {"t": "Système institutionnel et politique", "q": "Quand célèbre-t-on la journée de l'Europe ?", "a": "Le 9 mai", "wrong": ["Le 1er janvier", "Le 25 mars", "Le 14 juillet"], "explain": "Le 9 mai est la journée de l'Europe, en commémoration de la Déclaration Schuman du 9 mai 1950, qui proposa la mise en commun des productions de charbon et d'acier franco-allemandes, base de la construction européenne."}, {"t": "Système institutionnel et politique", "q": "À quelle fréquence les élections européennes sont-elles organisées ?", "a": "Tous les 5 ans", "wrong": ["Tous les 3 ans", "Tous les 4 ans", "Tous les 7 ans"], "explain": "Les élections européennes ont lieu tous les 5 ans dans l'ensemble des États membres de l'UE. Elles permettent aux citoyens européens d'élire directement leurs représentants au Parlement européen."}, {"t": "Système institutionnel et politique", "q": "Quelle condition est nécessaire pour voter aux élections européennes ?", "a": "Être citoyen d'un pays de l'UE, majeur et inscrit sur les listes électorales", "wrong": ["Avoir exclusivement la nationalité française", "Parler au moins deux langues officielles de l'UE", "Résider depuis plus de 10 ans dans un pays de l'UE"], "explain": "Pour voter aux élections européennes en France, il faut être citoyen d'un État membre de l'UE (et non uniquement français), avoir 18 ans et être inscrit sur les listes électorales."}, {"t": "Système institutionnel et politique", "q": "Quel pays est un pays fondateur de l'Union européenne ?", "a": "La France", "wrong": ["Le Royaume-Uni", "L'Espagne", "La Pologne"], "explain": "La France est l'un des 6 pays fondateurs de la CEE, avec l'Allemagne de l'Ouest, l'Italie, la Belgique, les Pays-Bas et le Luxembourg. La CEE a été créée par le Traité de Rome signé le 25 mars 1957."}, {"t": "Droits et devoirs", "q": "À quelle liberté la PMA fait-elle référence ?", "a": "La liberté de disposer de son corps et de fonder une famille", "wrong": ["La liberté d'expression scientifique", "La liberté de commerce et d'industrie", "La liberté de circulation sur le territoire"], "explain": "La PMA (Procréation Médicalement Assistée) fait référence au droit à la vie privée et familiale, à la liberté de disposer de son corps et au droit de fonder une famille. En France, la loi de 2021 l'a ouverte à toutes les femmes."}, {"t": "Droits et devoirs", "q": "Au nom de quoi l'État justifie-t-il la restriction des droits ?", "a": "La protection de l'ordre public, de la santé, de la sécurité et des droits d'autrui", "wrong": ["La protection des intérêts économiques des entreprises", "Le financement des services publics", "La défense des traditions culturelles nationales"], "explain": "L'État peut limiter certains droits et libertés au nom de l'ordre public, de la sécurité nationale, de la protection de la santé ou de la préservation des droits et libertés d'autrui. Ces restrictions doivent être proportionnées."}, {"t": "Droits et devoirs", "q": "Concernant le droit de se marier, quelle proposition est correcte ?", "a": "Tout majeur peut se marier librement avec la personne de son choix, quels que soient son sexe ou son origine", "wrong": ["Le mariage est réservé aux couples hétérosexuels", "Le mariage nécessite l'accord de la famille", "Le mariage est interdit entre personnes de religions différentes"], "explain": "En France, le mariage est ouvert à tous les majeurs, quelle que soit leur origine ou leur sexe (depuis la loi de 2013). Seule la mairie (mariage civil) confère une valeur juridique au mariage."}, {"t": "Droits et devoirs", "q": "Est-il toujours possible de divorcer ?", "a": "Oui, le divorce est légal en France", "wrong": ["Non, il est interdit sauf en cas de violence prouvée", "Non, seulement si les deux époux sont d'accord", "Oui, mais uniquement après 5 ans de mariage"], "explain": "Oui, le divorce est légal en France depuis la loi de 1884. Il peut être prononcé par consentement mutuel, pour altération définitive du lien conjugal ou pour faute."}, {"t": "Droits et devoirs", "q": "La peine de mort est :", "a": "Abolie en France depuis 1981", "wrong": ["Maintenue pour les crimes terroristes", "Suspendue mais toujours inscrite dans la loi", "Abolie en France uniquement depuis 2007"], "explain": "La peine de mort a été abolie en France par la loi du 9 octobre 1981, présentée par le garde des Sceaux Robert Badinter. L'abolition a ensuite été inscrite dans la Constitution lors de la révision de 2007."}, {"t": "Droits et devoirs", "q": "Laquelle de ces citations est inscrite dans la Déclaration des Droits de l'homme et du Citoyen de 1789 ?", "a": "\"Les hommes naissent et demeurent libres et égaux en droits\"", "wrong": ["\"La propriété est le vol\"", "\"Un peuple qui oublie son passé est condamné à le revivre\"", "\"La liberté des uns s'arrête où commence celle des autres\""], "explain": "L'article premier de la Déclaration des droits de l'homme et du citoyen du 26 août 1789 dispose : « Les hommes naissent et demeurent libres et égaux en droits. » C'est l'un des textes fondateurs de la démocratie moderne."}, {"t": "Droits et devoirs", "q": "Le recours à l'avortement est-il autorisé ?", "a": "Oui, dans les conditions prévues par la loi (IVG jusqu'à 14 semaines)", "wrong": ["Non, c'est interdit en France", "Oui, uniquement en cas de danger vital pour la mère", "Oui, sans aucune condition ni délai"], "explain": "L'IVG (Interruption Volontaire de Grossesse) est légale en France depuis la loi Veil de 1975. Elle est possible jusqu'à 14 semaines de grossesse (depuis 2022) et est prise en charge à 100 % par l'Assurance maladie."}, {"t": "Droits et devoirs", "q": "Que contient la Constitution ?", "a": "Les règles fondamentales d'organisation de l'État et les droits des citoyens", "wrong": ["L'ensemble des lois ordinaires votées par le Parlement", "Les règlements internes des partis politiques", "Les traités commerciaux conclus par la France"], "explain": "La Constitution est la loi fondamentale de l'État. Elle définit les institutions (Président, Parlement, gouvernement, justice), leurs attributions, et garantit les droits et libertés fondamentaux des citoyens."}, {"t": "Droits et devoirs", "q": "Que garantit la liberté de la presse ?", "a": "Le droit d'informer et de publier librement, sans censure préalable de l'État", "wrong": ["Le droit de publier n'importe quelle information sans être responsable", "Le droit exclusif de l'État à contrôler les médias", "Le droit des journalistes à ne jamais être poursuivis"], "explain": "La liberté de la presse garantit le droit d'informer, de publier et de critiquer sans censure préalable de l'État. Elle est encadrée : les journalistes restent responsables de leurs publications (diffamation, fausses informations...)."}, {"t": "Droits et devoirs", "q": "Que prévoit la Charte de l'environnement ?", "a": "Le droit de vivre dans un environnement sain et le devoir de protéger l'environnement", "wrong": ["L'obligation pour tous les citoyens d'avoir un jardin", "L'interdiction de tout développement industriel", "La création d'un ministère de l'environnement obligatoire"], "explain": "La Charte de l'environnement, adossée à la Constitution en 2005, reconnaît le droit à un environnement sain, le devoir de protéger l'environnement et le principe de précaution pour les activités pouvant lui nuire."}, {"t": "Droits et devoirs", "q": "Que signifie la dignité humaine ?", "a": "Le droit de chaque être humain à être respecté en tant que personne, quelles que soient ses caractéristiques", "wrong": ["Le droit à un salaire minimum pour tous les travailleurs", "L'obligation pour l'État de garantir le bonheur de chaque citoyen", "Le droit à un logement de standing pour tous"], "explain": "La dignité humaine est un principe fondamental : chaque être humain mérite d'être traité avec respect, quelles que soient son origine, son état de santé, sa situation sociale ou ses opinions. Elle est inviolable."}, {"t": "Droits et devoirs", "q": "Que signifie le droit de manifester ?", "a": "Le droit de se rassembler pacifiquement dans l'espace public pour exprimer collectivement ses opinions", "wrong": ["Le droit de bloquer les routes et d'empêcher la circulation", "Le droit de manifester uniquement avec l'accord du Président", "Le droit d'envahir les bâtiments publics pour protester"], "explain": "Le droit de manifester est un droit fondamental qui permet à chacun de se rassembler pacifiquement pour exprimer ses opinions. Les manifestations doivent être déclarées en préfecture et ne doivent pas troubler l'ordre public."}, {"t": "Droits et devoirs", "q": "Que signifie PMA ?", "a": "Procréation Médicalement Assistée", "wrong": ["Protection Maternelle et Animale", "Programme de Médecine Avancée", "Procédure de Médiation et d'Arbitrage"], "explain": "PMA signifie Procréation Médicalement Assistée. C'est un ensemble de techniques médicales (insémination artificielle, fécondation in vitro...) permettant à des personnes ayant des difficultés à concevoir un enfant d'y parvenir."}, {"t": "Droits et devoirs", "q": "Quel texte est le plus difficile à modifier ?", "a": "La Constitution", "wrong": ["Le Code civil", "Le règlement de l'Assemblée nationale", "Les lois ordinaires votées par le Parlement"], "explain": "La Constitution est la loi suprême de l'État. Sa révision requiert soit un vote des 3/5 des parlementaires réunis en Congrès, soit un référendum, ce qui la rend beaucoup plus difficile à modifier que les lois ordinaires."}, {"t": "Droits et devoirs", "q": "Quelle liberté permet à une personne de croire en la religion de son choix ?", "a": "La liberté de conscience et de religion", "wrong": ["La liberté d'association", "La liberté de circulation", "La liberté de la presse"], "explain": "La liberté de conscience et de religion est un droit fondamental garanti par la Constitution et la loi de 1905. Elle permet à chacun de croire librement, de pratiquer une religion, d'en changer ou de n'en avoir aucune."}, {"t": "Droits et devoirs", "q": "Qu'est-ce que le droit de grève ?", "a": "Le droit pour les travailleurs de cesser collectivement le travail pour défendre leurs intérêts", "wrong": ["Le droit pour un employeur de licencier les grévistes", "Le droit de refuser de payer ses impôts en signe de protestation", "Le droit de bloquer les accès d'une entreprise indéfiniment"], "explain": "Le droit de grève est un droit constitutionnel en France. Il permet aux travailleurs de cesser collectivement le travail pour défendre leurs revendications professionnelles ou sociales. Il s'exerce dans le cadre de la loi."}, {"t": "Droits et devoirs", "q": "Qu'est-ce que la Constitution ?", "a": "La loi fondamentale qui organise les pouvoirs de l'État et garantit les droits des citoyens", "wrong": ["L'ensemble des décrets pris par le gouvernement", "La liste des lois adoptées chaque année par le Parlement", "Le règlement intérieur du Parlement"], "explain": "La Constitution est la norme juridique suprême. Elle définit l'organisation des pouvoirs (Président, Parlement, gouvernement, justice), leurs compétences et les droits fondamentaux des citoyens. Toute loi doit la respecter."}, {"t": "Droits et devoirs", "q": "Qui peut demander à avorter ?", "a": "Toute femme enceinte qui en fait la demande, dans les délais légaux (14 semaines)", "wrong": ["Uniquement les femmes célibataires mineures", "Uniquement en cas de viol ou de danger vital", "Uniquement avec l'accord du père de l'enfant"], "explain": "En France, toute femme enceinte peut demander une IVG jusqu'à 14 semaines de grossesse (depuis la loi de 2022), sans avoir à justifier sa décision. L'IVG est un droit et est prise en charge par l'Assurance maladie."}, {"t": "Droits et devoirs", "q": "Une femme majeure de nationalité française a-t-elle le droit de voter aux élections ?", "a": "Oui, toute citoyenne française majeure a le droit de vote", "wrong": ["Non, les femmes votent depuis 2004 seulement", "Non, uniquement si elles sont propriétaires", "Oui, mais seulement depuis 1958"], "explain": "Oui. Les femmes françaises ont le droit de vote depuis l'ordonnance du 21 avril 1944, instituée à la Libération. Pour la première fois aux élections, toutes les femmes françaises ont voté en 1945."}, {"t": "Droits et devoirs", "q": "Concernant l'utilisation des réseaux sociaux, quelle proposition est correcte ?", "a": "Les règles de droit s'appliquent sur les réseaux sociaux comme dans la vie réelle", "wrong": ["On peut publier n'importe quoi sur les réseaux sociaux au nom de la liberté d'expression", "Les insultes publiées sous pseudonyme ne sont pas punissables", "La diffamation en ligne n'est pas sanctionnée si elle est effacée"], "explain": "Les lois françaises s'appliquent pleinement sur internet et les réseaux sociaux. Les insultes, la diffamation, l'incitation à la haine et les menaces en ligne sont punissables, même sous pseudonyme."}, {"t": "Droits et devoirs", "q": "Jeter un mégot par terre est :", "a": "Une infraction passible d'une amende", "wrong": ["Un geste légal car les mégots sont biodégradables", "Toléré dans les zones piétonnes des centres-villes", "Autorisé si aucun cendrier n'est disponible à proximité"], "explain": "Jeter un mégot de cigarette sur la voie publique est une contravention de 2e classe, passible d'une amende de 68 euros. Les mégots sont polluants et représentent un des déchets les plus répandus dans l'espace public."}, {"t": "Droits et devoirs", "q": "L'État peut-il limiter les droits et libertés ?", "a": "Oui, pour protéger l'ordre public, la santé ou les droits d'autrui, de façon proportionnée", "wrong": ["Non, les droits et libertés sont absolus et ne peuvent jamais être limités", "Oui, de façon illimitée et sans justification nécessaire", "Oui, mais seulement le Président de la République peut le décider"], "explain": "Oui, l'État peut limiter certains droits et libertés, mais ces restrictions doivent être prévues par la loi, justifiées par un objectif légitime (ordre public, santé, droits d'autrui) et proportionnées à ce but."}, {"t": "Droits et devoirs", "q": "Parmi ces actions, laquelle permet d'adopter une attitude respectueuse de l'environnement ?", "a": "Utiliser les transports en commun plutôt que la voiture individuelle", "wrong": ["Jeter ses ordures dans les rivières à la campagne", "Laisser ses appareils électroniques en veille en permanence", "Utiliser des emballages à usage unique pour les repas"], "explain": "Utiliser les transports en commun réduit les émissions de CO₂ et la pollution atmosphérique. Les gestes respectueux de l'environnement comprennent aussi le tri des déchets, les économies d'énergie et la consommation responsable."}, {"t": "Droits et devoirs", "q": "Quelle proposition constitue une obligation ?", "a": "Respecter le code de la route", "wrong": ["Voter lors des élections présidentielles", "Adhérer à un parti politique", "Participer aux associations de son quartier"], "explain": "Respecter le code de la route est une obligation légale pour tous les conducteurs et usagers de la voie publique. La violation de ces règles expose à des sanctions (amendes, retrait de permis, voire prison)."}, {"t": "Droits et devoirs", "q": "Pour quel motif peut-on limiter la liberté d'expression ?", "a": "Pour prévenir les discours haineux, la diffamation ou les appels à la violence", "wrong": ["Pour protéger la réputation d'un parti politique au pouvoir", "Pour empêcher la critique du gouvernement", "Pour éviter que des artistes expriment des opinions controversées"], "explain": "La liberté d'expression peut être limitée pour prévenir des abus : discours de haine, incitation à la discrimination, diffamation, menaces ou appels à la violence. Ces limitations sont prévues par la loi et contrôlées par les juges."}, {"t": "Droits et devoirs", "q": "Pourquoi doit-on trier ses déchets ?", "a": "Pour permettre le recyclage, réduire la pollution et préserver les ressources naturelles", "wrong": ["Pour réduire le montant de ses impôts locaux", "Parce que c'est une tradition française ancienne", "Pour permettre aux éboueurs de travailler moins longtemps"], "explain": "Le tri sélectif permet de recycler les matériaux (verre, papier, plastique, métal), de réduire la pollution des sols et des eaux, et de préserver les ressources naturelles. C'est une obligation légale en France."}, {"t": "Droits et devoirs", "q": "Que doit faire une victime de violences ?", "a": "Porter plainte auprès de la police ou de la gendarmerie", "wrong": ["Régler le problème à l'amiable sans impliquer les autorités", "Attendre que la situation s'améliore d'elle-même", "Quitter le territoire pour se mettre en sécurité"], "explain": "Une victime de violences doit porter plainte auprès de la police ou de la gendarmerie. Elle peut aussi appeler le 3919 (violences conjugales), le 17 (police) ou se rendre aux urgences. Elle a droit à une protection et à une aide juridique."}, {"t": "Droits et devoirs", "q": "Que doit-on faire face aux ordres des policiers ou gendarmes ?", "a": "Obtempérer aux injonctions légales des forces de l'ordre", "wrong": ["Refuser si l'on estime l'ordre injuste", "Appeler immédiatement son avocat avant de répondre", "Ignorer les ordres si l'on n'a rien à se reprocher"], "explain": "En France, on doit obtempérer aux ordres légaux des forces de l'ordre. Résister à une interpellation légale constitue un délit (outrage ou rébellion). On peut contester un abus ultérieurement devant la justice."}, {"t": "Droits et devoirs", "q": "Quel est le rôle de la police ?", "a": "Maintenir l'ordre public, assurer la sécurité des personnes et des biens", "wrong": ["Juger les infractions et prononcer les peines", "Voter les règlements de sécurité locaux", "Percevoir les impôts et les amendes pour l'État"], "explain": "La police nationale est chargée du maintien de l'ordre et de la sécurité publique, principalement en zone urbaine. Elle protège les personnes et les biens, prévient les infractions et interpelle les auteurs."}, {"t": "Droits et devoirs", "q": "Quel est un exemple d'assistance à personne en danger ?", "a": "Appeler le 15 ou le 18 en voyant une personne blessée sur la voie publique", "wrong": ["Photographier une scène d'accident pour la publier sur les réseaux sociaux", "Continuer son chemin pour ne pas perturber les secours", "Attendre qu'une autre personne prenne l'initiative d'appeler"], "explain": "La non-assistance à personne en danger est un délit pénal (article 223-6 du Code pénal). Appeler les secours (15, 18 ou 112) lorsqu'on est témoin d'une situation de danger est le minimum légalement exigé."}, {"t": "Droits et devoirs", "q": "Quel exemple illustre une limitation de liberté pour protéger l'intérêt général ?", "a": "L'interdiction de fumer dans les espaces publics fermés", "wrong": ["L'obligation de posséder un diplôme pour voter", "L'interdiction de voyager à l'étranger sans autorisation", "L'obligation de suivre la même religion que ses voisins"], "explain": "L'interdiction de fumer dans les lieux publics fermés (loi Evin et décrets de 2006-2007) est une limitation de la liberté individuelle justifiée par la protection de la santé publique (tabagisme passif)."}, {"t": "Droits et devoirs", "q": "Quelle est l'attitude à avoir lorsqu'on est témoin de violences ?", "a": "Appeler les secours (17 ou 112) et, si possible, aider la victime sans se mettre en danger", "wrong": ["Intervenir physiquement entre les protagonistes", "Ignorer la situation pour ne pas s'impliquer", "Filmer et diffuser sur les réseaux sociaux uniquement"], "explain": "Face à des violences, il faut appeler le 17 (police) ou le 112 (urgences) et, si possible, apporter son aide à la victime sans mettre sa propre sécurité en danger. Ne pas intervenir malgré les moyens de le faire constitue un délit."}, {"t": "Droits et devoirs", "q": "Quelle est l'infraction la plus grave ?", "a": "Le crime", "wrong": ["La contravention", "Le délit", "L'incivilité"], "explain": "Il existe trois niveaux d'infractions, du moins grave au plus grave : la contravention (amende, tribunal de police), le délit (tribunal correctionnel, jusqu'à 10 ans de prison) et le crime (cour d'assises, peines les plus lourdes)."}, {"t": "Droits et devoirs", "q": "Quelle obligation concerne toutes les personnes résidant en France quelle que soit leur nationalité ?", "a": "Respecter les lois françaises", "wrong": ["Voter aux élections présidentielles", "Servir dans l'armée française", "Parler français dans la vie quotidienne"], "explain": "Toute personne résidant sur le territoire français, quelle que soit sa nationalité, a l'obligation de respecter les lois françaises. L'ignorance de la loi n'est pas une excuse et ne dispense pas de la responsabilité pénale."}, {"t": "Droits et devoirs", "q": "Quelle proposition représente un exemple de crime ?", "a": "Un meurtre prémédité (assassinat)", "wrong": ["Un excès de vitesse de 20 km/h", "Le vol d'un téléphone portable", "Une insulte proférée en public"], "explain": "Le crime est l'infraction la plus grave. L'assassinat (meurtre avec préméditation) est un crime jugé par la cour d'assises, passible de la réclusion criminelle à perpétuité. Un vol simple est un délit, pas un crime."}, {"t": "Droits et devoirs", "q": "Quelle proposition représente un exemple de délit ?", "a": "Le vol à l'étalage", "wrong": ["Un excès de vitesse de 10 km/h", "Un stationnement interdit", "Un meurtre prémédité"], "explain": "Le délit est une infraction de gravité intermédiaire entre la contravention et le crime. Le vol (même à l'étalage) est un délit jugé par le tribunal correctionnel, passible d'une peine d'emprisonnement."}, {"t": "Droits et devoirs", "q": "Qui veille au maintien de l'ordre public ?", "a": "La police nationale et la gendarmerie nationale", "wrong": ["Les tribunaux administratifs", "Les élus locaux et les maires", "Les huissiers de justice"], "explain": "La police nationale (zones urbaines) et la gendarmerie nationale (zones rurales et périurbaines) sont les deux forces chargées du maintien de l'ordre public en France, sous l'autorité du ministère de l'Intérieur."}, {"t": "Droits et devoirs", "q": "S'agissant des déchets, quelle proposition est correcte ?", "a": "Les déchets doivent être triés et déposés dans les bacs ou déchetteries prévus à cet effet", "wrong": ["On peut brûler ses ordures dans son jardin si on vit à la campagne", "Il est légal de déposer ses encombrants sur le trottoir devant chez soi", "Le tri des déchets est facultatif et non sanctionné"], "explain": "Le tri des déchets est obligatoire en France. Les déchets ménagers doivent être déposés dans les bacs de tri appropriés. Les encombrants et déchets spéciaux doivent être apportés en déchetterie."}, {"t": "Histoire géographie et culture", "q": "Quel était le surnom de Louis XIV ?", "a": "Le Roi-Soleil", "wrong": ["Le Grand Monarque", "Le Roi de Fer", "Le Bien-Aimé"], "explain": "Louis XIV (1638-1715) est surnommé le « Roi-Soleil » en référence au soleil, symbole qu'il avait choisi pour représenter son règne absolu. Il a régné 72 ans, le plus long règne de l'histoire de France."}, {"t": "Histoire géographie et culture", "q": "Quel roi de France a été exécuté pendant la Révolution française ?", "a": "Louis XVI", "wrong": ["Louis XIV", "Louis XV", "Charles X"], "explain": "Louis XVI a été guillotiné le 21 janvier 1793 sur la place de la Révolution (actuelle place de la Concorde) à Paris. Il était roi de France depuis 1774."}, {"t": "Histoire géographie et culture", "q": "En quelle année Napoléon Ier est-il devenu empereur ?", "a": "1804", "wrong": ["1799", "1815", "1789"], "explain": "Napoléon Ier a été sacré Empereur des Français le 2 décembre 1804 à Notre-Dame de Paris, en présence du pape Pie VII. Il avait pris le pouvoir comme Premier Consul lors du coup d'État du 18 Brumaire (1799)."}, {"t": "Histoire géographie et culture", "q": "Lequel de ces personnages a un lien avec la République française ?", "a": "Victor Hugo", "wrong": ["William Shakespeare", "Napoleon Hill", "Isaac Newton"], "explain": "Victor Hugo (1802-1885) est l'un des plus grands écrivains français. Engagé politiquement, il a défendu la République et l'abolition de la peine de mort. Ses cendres reposent au Panthéon."}, {"t": "Histoire géographie et culture", "q": "De quand date l'appel à la résistance du général de Gaulle ?", "a": "Du 18 juin 1940", "wrong": ["Du 8 mai 1945", "Du 11 novembre 1918", "Du 6 juin 1944"], "explain": "Le 18 juin 1940, depuis Londres sur les ondes de la BBC, le général de Gaulle lança son célèbre appel à la résistance contre l'occupation allemande. Cet appel est considéré comme la naissance de la France Libre."}, {"t": "Histoire géographie et culture", "q": "Pourquoi la Shoah est-elle étudiée à l'école ?", "a": "Pour ne jamais oublier ce génocide et transmettre les valeurs d'humanité et de tolérance", "wrong": ["Pour rappeler la supériorité militaire des Alliés", "Pour montrer les erreurs diplomatiques de l'époque", "Pour illustrer l'histoire économique de la Seconde Guerre mondiale"], "explain": "La Shoah est étudiée à l'école pour honorer la mémoire des victimes, transmettre le devoir de mémoire, sensibiliser les élèves aux dangers du racisme et de l'antisémitisme et défendre les valeurs humanistes."}, {"t": "Histoire géographie et culture", "q": "Quel pays a été colonisé par la France ?", "a": "Le Sénégal", "wrong": ["Le Brésil", "L'Australie", "L'Inde"], "explain": "Le Sénégal a été colonisé par la France à partir du XVIIe siècle. Il a obtenu son indépendance le 4 avril 1960. La France a colonisé de nombreux pays d'Afrique, d'Asie et des Amériques."}, {"t": "Histoire géographie et culture", "q": "Depuis quand les Français élisent-ils le président de la République au suffrage universel direct ?", "a": "Depuis 1965 (réforme de 1962)", "wrong": ["Depuis 1958", "Depuis 1848", "Depuis 1874"], "explain": "La réforme constitutionnelle de 1962, adoptée par référendum à l'initiative du général de Gaulle, a instauré l'élection du Président au suffrage universel direct. La première élection au suffrage direct eut lieu en 1965."}, {"t": "Histoire géographie et culture", "q": "Quelle est la première étape de la construction européenne en 1951 ?", "a": "La création de la Communauté Européenne du Charbon et de l'Acier (CECA)", "wrong": ["La signature du Traité de Rome", "La création de l'euro comme monnaie unique", "La fondation de l'OTAN"], "explain": "La CECA (Communauté Européenne du Charbon et de l'Acier) a été fondée par le Traité de Paris signé le 18 avril 1951 par 6 pays. Elle fut la première organisation supranationale européenne."}, {"t": "Histoire géographie et culture", "q": "Durant le mandat de quel président la peine de mort a-t-elle été abolie ?", "a": "François Mitterrand (1981)", "wrong": ["Charles de Gaulle", "Georges Pompidou", "Valéry Giscard d'Estaing"], "explain": "La peine de mort a été abolie en France le 9 octobre 1981, sous la présidence de François Mitterrand, par une loi portée par le garde des Sceaux Robert Badinter."}, {"t": "Histoire géographie et culture", "q": "Quel régime politique a été mis en place pendant la Révolution française en 1792 ?", "a": "La République", "wrong": ["La monarchie constitutionnelle", "L'Empire", "La démocratie directe"], "explain": "La Ire République française a été proclamée le 21 septembre 1792, après l'abolition de la monarchie. C'est la première fois que la France adoptait officiellement le régime républicain."}, {"t": "Histoire géographie et culture", "q": "Qui était une figure de la Résistance française pendant la Seconde Guerre mondiale ?", "a": "Jean Moulin", "wrong": ["Philippe Pétain", "Pierre Laval", "Ferdinand Foch"], "explain": "Jean Moulin (1899-1943) est l'une des figures emblématiques de la Résistance française. Délégué du général de Gaulle en France occupée, il a unifié les mouvements de résistance. Arrêté par la Gestapo, il est mort en déportation."}, {"t": "Histoire géographie et culture", "q": "En 1944, qu'est-ce qui a changé pour les femmes ?", "a": "Elles ont obtenu le droit de vote", "wrong": ["Elles ont obtenu l'égalité de salaire avec les hommes", "Elles ont obtenu le droit de travailler sans l'accord du mari", "Elles ont obtenu le droit d'ouvrir un compte bancaire"], "explain": "Par l'ordonnance du 21 avril 1944 du Comité français de libération nationale, les femmes françaises ont obtenu le droit de vote. Elles ont exercé ce droit pour la première fois lors des élections municipales d'avril 1945."}, {"t": "Histoire géographie et culture", "q": "Quelle organisation internationale a été créée en 1945 après la Seconde Guerre mondiale ?", "a": "L'Organisation des Nations Unies (ONU)", "wrong": ["L'Union européenne", "Le Fonds Monétaire International uniquement", "L'OTAN"], "explain": "L'ONU (Organisation des Nations Unies) a été créée le 26 juin 1945 par la Charte de San Francisco. Elle regroupe aujourd'hui 193 États membres et a pour mission de maintenir la paix et la sécurité internationales."}, {"t": "Histoire géographie et culture", "q": "Quelle peine a été supprimée en 1981 ?", "a": "La peine de mort", "wrong": ["L'emprisonnement à vie", "Les travaux forcés en colonie", "La peine de bannissement"], "explain": "La peine de mort a été abolie en France par la loi du 9 octobre 1981. C'est Robert Badinter, garde des Sceaux, qui a présenté le projet de loi devant l'Assemblée nationale dans un discours historique."}, {"t": "Histoire
